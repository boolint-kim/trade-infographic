<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>양도세 중과 유예 만료 — 조정대상지역 시계열 분석</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f0f2f5;color:#1a1a2e;padding:24px 16px;font-size:13px}
  .container{max-width:1200px;margin:0 auto}

  /* 헤더 */
  .header{text-align:center;margin-bottom:20px}
  .header h1{font-size:22px;font-weight:800;margin-bottom:6px}
  .header .sub{font-size:12px;color:#6b7280;line-height:1.5}
  .deadline{display:inline-block;background:linear-gradient(135deg,#991b1b,#dc2626);color:#fff;padding:8px 24px;border-radius:24px;font-size:14px;font-weight:800;letter-spacing:1px;margin:12px 0 6px}
  .deadline-sub{font-size:11px;color:#9ca3af;margin-bottom:16px}

  /* 조정대상지역 안내 */
  .reg-info{background:#fff7ed;border-left:3px solid #f97316;padding:10px 14px;border-radius:0 8px 8px 0;margin-bottom:20px;font-size:12px;line-height:1.7;color:#78350f}

  /* 아코디언 — 대분류 */
  .group{margin-bottom:12px}
  .group-header{background:#1e293b;color:#fff;padding:12px 16px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;user-select:none}
  .group-header:hover{background:#334155}
  .group-header .arrow{transition:transform .2s;font-size:10px}
  .group.open>.group-header .arrow{transform:rotate(90deg)}
  .group-body{display:none;padding:4px 0 0}
  .group.open>.group-body{display:block}

  /* 아코디언 — 시군구 */
  .district{margin:4px 0;border-radius:8px;overflow:hidden;border:1px solid #e5e7eb}
  .district-header{background:#fff;padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;user-select:none}
  .district-header:hover{background:#f9fafb}
  .district-header .arrow{transition:transform .2s;font-size:9px;color:#9ca3af}
  .district.open>.district-header .arrow{transform:rotate(90deg)}
  .district.open>.district-header{background:#f1f5f9;border-bottom:1px solid #e5e7eb}
  .district-body{display:none;background:#fff;overflow-x:auto}
  .district.open>.district-body{display:block}
  .district-summary{color:#6b7280;font-size:12px;font-weight:400}
  .district-summary .price{color:#1a1a2e;font-weight:700}
  .district-summary .cnt{color:#6366f1;font-weight:600}

  /* 테이블 */
  .data-table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
  .data-table th{background:#f8fafc;padding:6px 10px;text-align:center;font-weight:600;color:#6b7280;border-bottom:1px solid #e5e7eb;position:sticky;left:0;z-index:1}
  .data-table td{padding:5px 10px;text-align:right;border-bottom:1px solid #f3f4f6}
  .data-table .row-label{text-align:left;font-weight:600;color:#374151;background:#f8fafc;position:sticky;left:0;z-index:1;min-width:60px}
  .data-table tr:last-child td{border-bottom:none}
  .data-table .ym-header{text-align:center;min-width:56px}
  .up{color:#10b981} .down{color:#ef4444} .zero{color:#9ca3af}
  .cnt-row td{color:#6366f1;font-weight:500}
  .cnt-row .row-label{color:#6366f1}

  /* 푸터 */
  .footer{text-align:center;font-size:11px;color:#9ca3af;margin-top:16px;line-height:1.7}

  @media(max-width:700px){
    body{padding:12px 8px;font-size:12px}
    .header h1{font-size:18px}
    .group-header{font-size:13px;padding:10px 12px}
    .district-header{font-size:12px;padding:8px 10px}
    .data-table{font-size:11px}
    .data-table th,.data-table td{padding:4px 6px}
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>양도세 중과 유예 만료</h1>
    <div class="sub">다주택자 양도소득세 중과 한시 유예 종료 — 조정대상지역 가격·거래 시계열 분석</div>
    <div class="deadline">2026. 05. 09</div>
    <div class="deadline-sub">이후 계약분부터 다주택자 양도세 중과 (기본세율 + 20~30%p) 재적용</div>
  </div>

  <div class="reg-info">
    <strong>조정대상지역 (2026.02 기준)</strong><br>
    서울 25개 구 전체 | 경기 12곳: 과천 · 광명 · 성남(분당·수정·중원) · 수원(영통·장안·팔달) · 안양 동안 · 용인 수지 · 의왕 · 하남
  </div>

  <div id="accordion"></div>

  <div class="footer">
    데이터 출처: 국토교통부 실거래가 공개시스템 | 해제 거래 제외 | <span id="genDate"></span>
  </div>
</div>

<script>
function fmtYM(ym) { return ym.slice(2, 4) + '.' + ym.slice(4); }
function fmtPrice(v) { return v !== null && v !== undefined ? v.toFixed(1) : '-'; }
function fmtCnt(v) { return v !== null && v !== undefined ? v.toLocaleString('ko-KR') : '-'; }

// 전월 대비 증감 클래스
function chgClass(cur, prev) {
  if (cur == null || prev == null) return '';
  if (cur > prev) return 'up';
  if (cur < prev) return 'down';
  return 'zero';
}

function buildTable(monthly) {
  if (!monthly || monthly.length === 0) return '<div style="padding:12px;color:#9ca3af">데이터 없음</div>';

  const yms = monthly.map(m => m.ym);
  let html = '<table class="data-table"><thead><tr><th class="row-label"></th>';
  yms.forEach(ym => { html += `<th class="ym-header">${fmtYM(ym)}</th>`; });
  html += '</tr></thead><tbody>';

  // 85형 평균가
  html += '<tr><td class="row-label">85형</td>';
  monthly.forEach((m, i) => {
    const cls = i > 0 ? chgClass(m.price85, monthly[i - 1].price85) : '';
    html += `<td class="${cls}">${fmtPrice(m.price85)}</td>`;
  });
  html += '</tr>';

  // 59형 평균가
  html += '<tr><td class="row-label">59형</td>';
  monthly.forEach((m, i) => {
    const cls = i > 0 ? chgClass(m.price59, monthly[i - 1].price59) : '';
    html += `<td class="${cls}">${fmtPrice(m.price59)}</td>`;
  });
  html += '</tr>';

  // 전체 평균가
  html += '<tr><td class="row-label">전체</td>';
  monthly.forEach((m, i) => {
    const cls = i > 0 ? chgClass(m.priceAll, monthly[i - 1].priceAll) : '';
    html += `<td class="${cls}">${fmtPrice(m.priceAll)}</td>`;
  });
  html += '</tr>';

  // 거래건수
  html += '<tr class="cnt-row"><td class="row-label">건수</td>';
  monthly.forEach(m => { html += `<td>${fmtCnt(m.cntAll)}</td>`; });
  html += '</tr>';

  html += '</tbody></table>';
  return html;
}

function buildDistrict(d) {
  const avgStr = d.summary.avgPrice ? d.summary.avgPrice.toFixed(1) + '억' : '-';
  const cntStr = d.summary.totalCnt ? d.summary.totalCnt.toLocaleString('ko-KR') + '건' : '-';
  return `
    <div class="district" onclick="this.classList.toggle('open')">
      <div class="district-header">
        <span>${d.name} <span class="district-summary"><span class="price">${avgStr}</span> · <span class="cnt">${cntStr}</span></span></span>
        <span class="arrow">▶</span>
      </div>
      <div class="district-body">${buildTable(d.monthly)}</div>
    </div>`;
}

function buildGroup(title, districts, openByDefault) {
  const cls = openByDefault ? 'group open' : 'group';
  let inner = '';
  districts.forEach(d => { inner += buildDistrict(d); });
  return `
    <div class="${cls}">
      <div class="group-header" onclick="this.parentElement.classList.toggle('open')">
        <span>${title} (${districts.length}곳)</span>
        <span class="arrow">▶</span>
      </div>
      <div class="group-body">${inner}</div>
    </div>`;
}

async function load() {
  let D;
  try { D = await (await fetch('data/event-cgt.json')).json(); }
  catch { try { D = await (await fetch('event-cgt.json')).json(); } catch { return; } }

  document.getElementById('genDate').textContent = `생성일: ${D.meta.generated.slice(0, 10)}`;

  const el = document.getElementById('accordion');
  el.innerHTML = buildGroup('서울특별시', D.seoul, true) + buildGroup('경기도 조정대상지역', D.gyeonggi, false);
}

load();
</script>
</body>
</html>
