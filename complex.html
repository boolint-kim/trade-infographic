<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단지 실거래가</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="chart-defaults.js"></script>
<script src="region-select.js"></script>
<script src="dash.js"></script>
<script src="trade-api.js"></script>
<script src="calc/brokerage.js"></script>
<script src="calc/acqtax.js"></script>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="dash.css">
<script src="selfbanner-web.js" defer></script>
<style>
  :root{--accent:#6366f1;--accent-soft:#6366f122}
  .cx-head{text-align:left;margin-bottom:16px}
  .cx-head h1{font-size:24px;font-weight:800;margin-bottom:6px}
  .cx-head .where{font-size:13px;color:var(--text-muted);line-height:1.7}
  .cx-head .facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .cx-head .facts span{font-size:12px;color:var(--text-muted);background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:3px 9px}
  .cx-head .facts a{font-size:12px;font-weight:700;color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:12px;padding:3px 9px}
  .type-tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent);vertical-align:4px;margin-left:6px}
  .area-bar{margin-bottom:16px}
  .area-bar .chips{gap:5px}
  .more{display:block;margin:12px auto 0;font:inherit;font-size:13px;font-weight:700;color:var(--accent);background:none;border:1px solid var(--accent);border-radius:16px;padding:6px 18px;cursor:pointer}
  .tbl .cx{color:var(--text-faint);text-decoration:line-through}
  .tag-x{background:#ef444422;color:#ef4444}
  .pick-input{font:inherit;font-size:15px;width:100%;max-width:420px;display:block;margin:4px auto 12px;padding:9px 12px;border:2px solid var(--accent);border-radius:10px;background:var(--card-bg);color:var(--text)}
  .pick-list a{display:flex;justify-content:space-between;gap:8px;padding:9px 6px;border-bottom:1px solid var(--border-soft);color:var(--text);text-decoration:none;font-size:14px}
  .pick-list a:hover{background:var(--row-hover)}
  .pick-list .faint{color:var(--text-faint);font-size:12px;white-space:nowrap}
  @media(max-width:700px){ .cx-head h1{font-size:20px} }
</style>
</head>
<body>
<div class="container">
  <div id="dashStatus" class="pending" style="display:none;text-align:center;color:#ef4444;margin:20px 0"></div>

  <!-- 단지 키가 없을 때: 시군구 → 이름으로 고르기 -->
  <div id="picker" style="display:none">
    <div class="header"><h1>단지 실거래가</h1><p>시군구를 고르고 단지 이름을 찾으세요 · 아파트·분양권·오피스텔</p></div>
    <div id="regionBar"></div>
    <section class="dsec"><div class="dsec-body">
      <input id="pickQ" class="pick-input" type="search" placeholder="단지 이름 (예: 래미안)" autocomplete="off">
      <div class="sub-desc" id="pickInfo" style="text-align:center"></div>
      <div class="pick-list" id="pickList"></div>
    </div></section>
  </div>

  <!-- 단지 상세 -->
  <div id="detail" style="display:none">
    <div class="cx-head" id="cxHead"></div>
    <div class="area-bar" id="areaChips"></div>

    <section class="dsec" id="summary" data-nav="요약">
      <div class="dsec-head"><div><div class="dsec-title">최근 1년</div>
        <div class="dsec-desc" id="sumDesc"></div></div></div>
      <div class="dsec-body"><div class="cards" id="sumCards"></div><div class="note" id="sumNote"></div></div>
    </section>

    <section class="dsec" id="chart" data-nav="가격 추이">
      <div class="dsec-head"><div><div class="dsec-title">거래 가격</div>
        <div class="dsec-desc">점 하나가 거래 한 건 · 매매와 전세 보증금을 같은 축에 · 해제된 거래는 회색 ×</div></div>
        <div id="periodChips"></div></div>
      <div class="dsec-body">
        <div class="chart-wrap" style="height:340px"><canvas id="cxChart"></canvas></div>
        <div class="note" id="chartNote"></div>
      </div>
    </section>

    <section class="dsec" id="list" data-nav="거래 목록">
      <div class="dsec-head"><div><div class="dsec-title">거래 목록</div>
        <div class="dsec-desc" id="listDesc">최신순</div></div>
        <div id="listChips"></div></div>
      <div class="dsec-body"><div id="listTable"></div><button class="more" id="listMore" type="button" style="display:none">더 보기</button></div>
    </section>
  </div>

  <div class="footer">데이터 출처: 국토교통부 실거래가 공개시스템 | <span id="genDate"></span><br>
  ※ 공공데이터를 기반으로 제작되었으며 정확성·완전성을 보장하지 않습니다. 실거래 신고는 계약 후 30일 안에 들어오므로 최근 두 달은 집계 중입니다.<br>
  집계(중앙값·전세가율 등)는 계약 해제된 거래를 제외합니다. 목록에는 해제 거래도 취소선으로 남겨 둡니다.</div>
</div>

<script>
// 단지 상세 — ?key=apt:11680-218 | ?pnu=<19자리> [&area=84(전용 반올림 ㎡)] [&tab=deal|jeonse|wolse]
// 숫자 카드는 요약 조각(c/{key}/summary — 계산 정본 trade-collector)을 그대로 쓴다. 이 페이지는 행을 거르기만 한다
(function () {
  const D = Dash, A = TradeApi;
  const q = new URLSearchParams(location.search);
  const C_DEAL = '#6366f1', C_JEONSE = '#10b981';
  const PAGE = 40;
  // 만원 → "33억 4,000" / "8,500만" — 단지 상세는 억 단위 반올림(Dash.eok)으로는 거래끼리 구분이 안 된다. 차트 축만 eok
  const won = v => {
    if (v == null) return '-';
    const e = Math.floor(v / 10000), r = v % 10000;
    return e ? `${e}억${r ? ` ${D.fmt(r)}` : ''}` : `${D.fmt(r)}만`;
  };

  function fail(msg) {
    const box = document.getElementById('dashStatus');
    box.innerHTML = msg; box.style.display = 'block';
  }
  function setParam(k, v) {
    try { const p = new URLSearchParams(location.search); if (v == null || v === '') p.delete(k); else p.set(k, v);
      history.replaceState(null, '', `${location.pathname}?${p}${location.hash}`); } catch (e) { /* 부가 기능 */ }
  }
  const linkTo = key => `complex.html?key=${encodeURIComponent(key)}`;

  // ─── 진입: key | pnu | 없음(고르기) ─────────────────────
  async function boot() {
    let key = q.get('key');
    const pnu = q.get('pnu');
    if (!A.isKey(key) && pnu) {
      let keys;
      try { keys = await A.resolvePnu(pnu); } catch (e) { console.error(e); return fail('데이터 로딩 실패 — 잠시 뒤 다시 열어 주세요'); }
      if (!keys.length) return fail('이 필지에 실거래 단지가 없습니다');
      if (keys.length > 1) return candidates(keys);
      key = keys[0];
      setParam('key', key);
    }
    if (!A.isKey(key)) return picker();
    return detail(key);
  }

  // 한 필지에 단지가 여럿(아파트 + 같은 건물의 오피스텔·분양권 등)
  async function candidates(keys) {
    const sums = await Promise.all(keys.map(k => A.summary(k).catch(() => null)));
    document.getElementById('picker').style.display = 'block';
    document.getElementById('regionBar').style.display = 'none';
    document.getElementById('pickQ').style.display = 'none';
    document.querySelector('#picker .header p').textContent = '이 필지에 단지가 여럿 있습니다 — 하나를 고르세요';
    document.getElementById('pickList').innerHTML = keys.map((k, i) => {
      const s = sums[i] || {};
      return `<a href="${linkTo(k)}"><span>${D.esc(s.name || k)} <span class="tag-mini">${A.TYPE_NAME[k.split(':')[0]] || ''}</span></span>
        <span class="faint">${s.totals ? `매매 ${D.fmt(s.totals.deals)} · 전월세 ${D.fmt(s.totals.rents)}` : ''}</span></a>`;
    }).join('');
  }

  // ─── 고르기: 시군구 이름 색인(sgg/{code}.index) 로컬 필터 ───
  async function picker() {
    document.getElementById('picker').style.display = 'block';
    const reg = await A.regionNames();
    if (!reg.sido.length) return fail('데이터 로딩 실패 — 잠시 뒤 다시 열어 주세요');
    let items = [], seq = 0;
    const input = document.getElementById('pickQ'), info = document.getElementById('pickInfo'), list = document.getElementById('pickList');

    function draw() {
      const s = input.value.replace(/\s+/g, '');
      const hit = s ? items.filter(x => x.search.includes(s)) : items;
      info.textContent = items.length ? `${D.fmt(hit.length)}개 단지${hit.length > 100 ? ' — 앞 100개만 보입니다. 이름을 더 입력하세요' : ''}` : '';
      list.innerHTML = hit.slice(0, 100).map(x => `<a href="${linkTo(x.key)}"><span>${D.esc(x.name)} <span class="tag-mini">${A.TYPE_NAME[x.type] || ''}</span></span>
        <span class="faint">${D.esc(x.umd)}</span></a>`).join('');
    }
    input.oninput = draw;

    RegionSelect.init({
      container: '#regionBar',
      sidos: reg.sido.map(s => ({ code: s.code, name: s.name })),
      sggOf: sido => (reg.sido.find(s => s.code === sido) || {}).sgg || [],
      defaultSido: '11',
      onChange: async (sido, sgg) => {
        const my = ++seq;
        items = [];
        if (!sgg) { list.innerHTML = '<div class="hint">시군구를 고르세요</div>'; info.textContent = ''; return; }
        list.innerHTML = '<div class="pending">불러오는 중…</div>';
        let f;
        try { f = await A.sgg(sgg); } catch (e) { console.error(e); return fail('데이터 로딩 실패 — 잠시 뒤 다시 열어 주세요'); }
        if (my !== seq) return;
        // 색인 = [[읍면동, 이름(이명 포함), type, key]] — 이명은 같은 key 로 여러 줄. 검색은 모든 이름으로, 표시는 첫 이름
        const byKey = new Map();
        for (const [umd, name, type, key] of (f && f.index) || []) {
          const x = byKey.get(key);
          if (x) x.search += '|' + name;
          else byKey.set(key, { key, name, type, umd, search: name });
        }
        // 색인은 가나다순이라 "(1237-3)" 같은 번지 이름이 맨 앞에 온다 — 한글로 시작하는 이름을 먼저
        const hangul = x => /^[가-힣]/.test(x.name) ? 0 : 1;
        items = [...byKey.values()].sort((a, b) => hangul(a) - hangul(b));
        draw();
      },
    });
  }

  // ─── 상세 ───────────────────────────────────────────────
  async function detail(key) {
    let full, sum, reg;
    try { [full, sum, reg] = await Promise.all([A.complex(key), A.summary(key), A.regionNames()]); }
    catch (e) { console.error(e); return fail('데이터 로딩 실패 — 잠시 뒤 다시 열어 주세요'); }
    if (!full) return fail(`단지를 찾을 수 없습니다 — <a href="complex.html">다른 단지 찾기</a>`);

    const cx = full.complex;
    const deals = A.rows(full.deals).map(r => ({ ...r, aKey: Math.round(r.area) }));
    const rents = A.rows(full.rents).map(r => ({ ...r, aKey: Math.round(r.area) }));
    const byArea = (sum && sum.byArea) || [];
    document.title = `${cx.name} 실거래가`;
    document.getElementById('detail').style.display = 'block';
    document.getElementById('genDate').textContent = `기준: ${D.ymText(full.asOf)}까지 신고분`;

    head(cx, reg.sggName(cx.sgg));

    // 면적 칩 — 요약의 면적 묶음(전용 반올림 ㎡). 첫 화면은 ?area= 또는 최근 1년 거래가 가장 많은 면적
    const areaFacets = { all: '전체' };
    const sorted = [...byArea].sort((a, b) => a.areaKey - b.areaKey);
    for (const b of sorted) areaFacets[b.areaKey] = `${b.areaKey}㎡${b.form ? `(${b.form}형)` : ''}`;
    const busiest = [...byArea].sort((a, b) => n12(b) - n12(a) || (b.deal ? b.deal.nAll : 0) - (a.deal ? a.deal.nAll : 0))[0];
    let area = q.get('area') in areaFacets ? q.get('area') : (busiest ? String(busiest.areaKey) : 'all');

    // 거래가 끊긴 단지(입주 끝난 분양권 등)는 3년 창이 비므로 전체로 시작
    const lastY = cx.lastDeal ? +cx.lastDeal.slice(0, 4) + (+cx.lastDeal.slice(5, 7)) / 12 : 0;
    const asOfY = +full.asOf.slice(0, 4) + (+full.asOf.slice(4, 6)) / 12;
    const st = { area, period: asOfY - lastY > 2.5 ? 'all' : '3', tab: ['deal', 'jeonse', 'wolse'].includes(q.get('tab')) ? q.get('tab') : 'deal', shown: PAGE };
    const types = { deal: '매매', jeonse: '전세', wolse: '월세' };
    if (cx.type === 'right') { delete types.jeonse; delete types.wolse; st.tab = 'deal'; }

    function pick(list) { return st.area === 'all' ? list : list.filter(r => String(r.aKey) === st.area); }

    function renderAll() {
      chipRow('areaChips', areaFacets, st.area, k => { st.area = k; st.shown = PAGE; setParam('area', k === 'all' ? '' : k); renderAll(); });
      const d = pick(deals), r = pick(rents);
      cards(sum, cx, d);
      chart(d, r);
      table(d, r);
    }

    function cards(sum, cx, d) {
      const b = st.area === 'all' ? null : byArea.find(x => String(x.areaKey) === st.area);
      const desc = document.getElementById('sumDesc');
      const box = document.getElementById('sumCards');
      const note = document.getElementById('sumNote');
      const win = sum ? `${D.ymText(prevYm(sum.asOf, 11))}~${D.ymText(sum.asOf)}` : '';
      if (!sum) { box.innerHTML = '<div class="pending">요약을 불러오지 못했습니다</div>'; return; }
      if (!b) {
        // 전체 — 면적이 섞이므로 금액 중앙값은 내지 않는다(면적을 고르면 나온다)
        desc.textContent = `${win} · 면적이 섞여 있어 금액은 면적을 고르면 보입니다`;
        D.cards(box, [
          { label: '매매 거래', value: D.fmt(sum.totals.deals12m), unit: '건', sub: `전 기간 ${D.fmt(sum.totals.deals)}건 · 최근 ${sum.totals.lastDeal || '-'}` },
          ...(cx.type === 'right' ? [] : [{ label: '전월세 거래', value: D.fmt(sum.totals.rents12m), unit: '건', sub: `전 기간 ${D.fmt(sum.totals.rents)}건` }]),
          sum.newHigh ? { label: '역대 최고가', value: won(sum.newHigh.amount), sub: `${sum.newHigh.date} · ${sum.newHigh.area}㎡ · ${sum.newHigh.floor}층` } : { label: '역대 최고가', value: null },
        ]);
      } else {
        desc.textContent = `${win} · 전용 ${+b.area.toFixed(2)}㎡ 기준 · 신고 중인 최근 두 달 포함`;
        const dl = b.deal || {}, js = b.jeonse || {}, ws = b.wolse || {};
        const valid = d.filter(r => r.cancel == null);
        const top = valid.reduce((m, r) => (!m || r.amount > m.amount ? r : m), null);
        const list = [
          { label: '매매 중앙값', value: dl.n12 ? won(dl.med12) : null, sub: dl.n12 ? `${dl.n12}건 · ${won(dl.min12)} ~ ${won(dl.max12)}` : '최근 1년 거래 없음' },
        ];
        if (cx.type !== 'right') list.push(
          { label: '전세 중앙값', value: js.n12 ? won(js.med12) : null, sub: js.n12 ? `${js.n12}건 · 전세가율 ${b.jeonseRatio == null ? '표본 부족' : b.jeonseRatio + '%'}` : '최근 1년 거래 없음' },
          { label: '월세 중앙값', value: ws.n12 ? `${won(ws.dep12)} / ${D.fmt(ws.rent12)}` : null, sub: ws.n12 ? `${ws.n12}건 · 보증금 / 월세(만원) · 전환율 ${b.convRate == null ? '표본 부족' : b.convRate + '%'}` : '최근 1년 거래 없음' },
        );
        list.push({ label: '이 면적 최고가', value: top ? won(top.amount) : null, sub: top ? `${top.date} · ${top.floor}층` : '거래 없음' });
        D.cards(box, list);
      }
      const extra = [];
      if (sum.cancel12m) extra.push(`최근 1년 해제 신고 ${sum.cancel12m}건(단지 전체)`);
      if (sum.corp12m) extra.push(`법인 거래 비율 ${sum.corp12m}%`);
      if (b && b.yieldRate != null) extra.push(`월세 수익률 ${b.yieldRate}%`);
      note.innerHTML = [...extra, '중앙값·전세가율·전환율은 해제 거래를 뺀 같은 면적 기준'].map(D.esc).join(' · ');
    }

    // 산점도 — x = 연도(소수), 날짜 어댑터 없이 linear 축
    function chart(d, r) {
      const periods = { 1: '1년', 3: '3년', 5: '5년', all: '전체' };
      chipRow('periodChips', periods, st.period, k => { st.period = k; chart(pick(deals), pick(rents)); });
      const lastYm = full.asOf;
      const end = +lastYm.slice(0, 4) + (+lastYm.slice(4, 6)) / 12;
      const from = st.period === 'all' ? -Infinity : end - +st.period;
      const xOf = date => +date.slice(0, 4) + (+date.slice(5, 7) - 1) / 12 + (+date.slice(8, 10) - 1) / 365;
      const pt = row => ({ x: xOf(row.date), y: row.amount != null ? row.amount : row.deposit, row });
      const inP = p => p.x >= from;
      const valid = d.filter(x => x.cancel == null).map(pt).filter(inP);
      const cancel = d.filter(x => x.cancel != null).map(pt).filter(inP);
      const jeonse = r.filter(x => !x.rent).map(pt).filter(inP);
      const rad = D.isMobile ? 2.5 : 3;
      const ds = [
        { label: `매매 ${valid.length}건`, data: valid, backgroundColor: C_DEAL + 'bb', borderColor: C_DEAL, pointRadius: rad },
      ];
      if (cx.type !== 'right') ds.push({ label: `전세 ${jeonse.length}건`, data: jeonse, backgroundColor: C_JEONSE + '88', borderColor: C_JEONSE, pointRadius: rad });
      if (cancel.length) ds.push({ label: `해제 ${cancel.length}건`, data: cancel, pointStyle: 'crossRot', borderColor: chartTheme.axis(), backgroundColor: chartTheme.axis(), pointRadius: rad + 2, borderWidth: 1.5 });
      // 전체 기간은 데이터 범위로 — 거래가 끊긴 단지가 오늘까지 늘어나 왼쪽에 몰리지 않게
      const xs = ds.flatMap(s => s.data.map(p => p.x));
      const xMin = Number.isFinite(from) ? from : Math.min(...xs, end - 1);
      const xMax = Number.isFinite(from) || !xs.length ? end : Math.ceil(Math.max(...xs) * 4) / 4;
      D.chart('cxChart', {
        type: 'scatter',
        data: { datasets: ds },
        options: { responsive: true, maintainAspectRatio: false, animation: false,
          plugins: { legend: { position: 'top' },
            tooltip: { callbacks: { label: it => { const w = it.raw.row;
              return `${w.date} · ${+w.area.toFixed(2)}㎡ · ${w.floor}층 · ${won(it.raw.y)}${w.cancel ? ' (해제)' : ''}`; } } } },
          scales: {
            x: { type: 'linear', min: Math.floor(xMin * 4) / 4, max: xMax,
              // 눈금은 직접 만든다 — 자동 눈금은 min(분기 단위)에서 출발해 정수 연도를 빼먹는다
              afterBuildTicks: ax => {
                const step = st.period === '1' ? 0.25 : (ax.max - ax.min > 8 ? 2 : 1), t = [];
                for (let v = Math.ceil(ax.min / step - 1e-9) * step; v <= ax.max + 1e-9; v += step) t.push({ value: +v.toFixed(2) });
                ax.ticks = t;
              },
              ticks: { autoSkip: false, callback: v => st.period === '1' ? `${String(Math.floor(v)).slice(2)}.${String(Math.round((v % 1) * 12) + 1).padStart(2, '0')}` : v },
              grid: { color: chartTheme.grid() } },
            y: { ticks: { callback: v => v >= 10000 ? `${+(v / 10000).toFixed(2)}억` : `${D.fmt(v)}만` }, grid: { color: chartTheme.grid() } } } },
      });
      const wolseN = r.filter(x => x.rent > 0).length;
      document.getElementById('chartNote').innerHTML = [
        st.area === 'all' && byArea.length > 1 ? '면적이 섞여 있습니다 — 위에서 면적을 고르면 비교가 쉽습니다' : '',
        wolseN ? `월세 ${D.fmt(wolseN)}건은 보증금만으로는 비교가 안 돼 점에서 뺐습니다(목록의 월세 탭)` : '',
        '최근 두 달은 신고가 다 들어오지 않았습니다',
      ].filter(Boolean).map(D.esc).join(' · ');
    }

    function table(d, r) {
      chipRow('listChips', types, st.tab, k => { st.tab = k; st.shown = PAGE; setParam('tab', k === 'deal' ? '' : k); table(pick(deals), pick(rents)); });
      const showArea = st.area === 'all';
      // 중개보수 상한 — RealEstateCal 정본(calc/brokerage.js). 분양권은 거래가액 기준(계약금·중도금·프리미엄)이 달라 빼고, 오피스텔은 주거용 요율
      const feeObj = window.Calc && Calc.brokerage ? ({ apt: '주택', office: '오피스텔' })[cx.type] : null;
      // 취득세 — AcqTax 정본(calc/acqtax.js). 아파트 1주택 매매(조정 여부 무관), 오피스텔 4.6%. 분양권은 취득이 입주 때라 뺀다
      const acqOn = !!(window.Calc && Calc.acqtax) && (cx.type === 'apt' || cx.type === 'office');
      const acqText = x => { const t = Calc.acqtax.dealTax(cx.type, x.amount, x.area); return t ? won(Math.round(t.tax / 10000)) : ''; };
      let list, cols;
      const base = [
        { label: '계약일', get: x => x.date },
        ...(showArea ? [{ label: '전용', cls: 'num', get: x => `${+x.area.toFixed(2)}㎡` }] : []),
        { label: '층', cls: 'num', get: x => x.floor == null ? '-' : x.floor },
      ];
      if (st.tab === 'deal') {
        list = d;
        cols = [...base,
          { label: '거래가', cls: 'num', get: x => x.cancel ? `<span class="cx">${won(x.amount)}</span>` : `<b>${won(x.amount)}</b>` },
          ...(feeObj ? [{ label: '중개보수', cls: 'num', get: x => x.cancel ? '' : `<span class="faint">${feeText(feeObj, '매매', x.amount, 0)}</span>` }] : []),
          ...(acqOn ? [{ label: '취득세', cls: 'num', get: x => x.cancel ? '' : `<span class="faint">${acqText(x)}</span>` }] : []),
          { label: '비고', get: x => dealNote(x) }];
      } else {
        list = r.filter(x => st.tab === 'jeonse' ? !x.rent : x.rent > 0);
        cols = [...base,
          { label: st.tab === 'jeonse' ? '보증금' : '보증금 / 월세', cls: 'num', get: x => `<b>${won(x.deposit)}${x.rent ? ` / ${D.fmt(x.rent)}` : ''}</b>` },
          ...(feeObj ? [{ label: '중개보수', cls: 'num', get: x => `<span class="faint">${feeText(feeObj, x.rent ? '월세' : '전세', x.deposit, x.rent || 0)}</span>` }] : []),
          { label: '구분', get: x => D.esc(x.contractType || '-') },
          { label: '종전', cls: 'num', get: x => x.preDeposit == null ? '' : `${won(x.preDeposit)}${x.preRent ? ` / ${D.fmt(x.preRent)}` : ''}` },
          { label: '계약기간', get: x => `<span class="faint">${D.esc(x.term || '')}</span>` }];
      }
      list = [...list].reverse();   // 행은 날짜 오름차순으로 온다(계약 §3.3)
      document.getElementById('listDesc').textContent = `최신순 · ${D.fmt(list.length)}건${st.tab === 'deal' ? ' · 취소선 = 계약 해제' : ''}`
        + (feeObj ? ` · 중개보수 = 법정 상한(부가세 별도${feeObj === '오피스텔' ? ', 주거용 오피스텔 기준' : ''}, 실제는 협의)` : '')
        + (acqOn && st.tab === 'deal' ? (cx.type === 'office' ? ' · 취득세 = 4.6%(오피스텔은 주택 수와 무관)' : ' · 취득세 = 1주택 매매 기준(지방교육세·농특세 포함, 다주택·법인은 다름)') : '');
      D.table(document.getElementById('listTable'), cols, list.slice(0, st.shown), '거래가 없습니다');
      const more = document.getElementById('listMore');
      more.style.display = list.length > st.shown ? 'block' : 'none';
      more.textContent = `더 보기 (${D.fmt(list.length - st.shown)}건 남음)`;
      more.onclick = () => { st.shown += PAGE * 2; table(pick(deals), pick(rents)); };
    }

    function dealNote(x) {
      const t = [];
      if (x.cancel) t.push(`<span class="tag-mini tag-x">해제 ${D.esc(x.cancel)}</span>`);
      if (x.ownership) t.push(`<span class="tag-mini">${D.esc(x.ownership)}</span>`);
      if (x.dealing === '직거래') t.push('<span class="tag-mini">직거래</span>');
      if (x.seller === '법인' || x.buyer === '법인') t.push(`<span class="tag-mini">법인 ${x.seller === '법인' ? '매도' : '매수'}</span>`);
      if (x.dong) t.push(`<span class="faint">${D.esc(x.dong)}동</span>`);
      return t.join(' ');
    }

    renderAll();
    const target = location.hash && document.getElementById(location.hash.slice(1));
    if (target && target.classList.contains('dsec')) target.scrollIntoView();
  }

  function head(cx, sggName) {
    const facts = [];
    if (cx.buildYear) facts.push(`${cx.buildYear}년 준공`);
    facts.push(`매매 ${D.fmt(cx.dealCount)}건`);
    if (cx.type !== 'right') facts.push(`전월세 ${D.fmt(cx.rentCount)}건`);
    if (cx.ipCount) facts.push(`입주권 ${D.fmt(cx.ipCount)}건`);
    if (cx.lastDeal) facts.push(`최근 거래 ${cx.lastDeal}`);
    if (cx.firstYm) facts.push(`${D.ymText(cx.firstYm)}~ 기록`);
    const links = [];
    if (cx.links && cx.links.apt) links.push(`<a href="${linkTo(cx.links.apt)}">입주 후 아파트 →</a>`);
    if (cx.links && cx.links.right) links.push(`<a href="${linkTo(cx.links.right)}">분양권·입주권 거래 →</a>`);
    const others = (cx.names || []).filter(n => n !== cx.name);
    document.getElementById('cxHead').innerHTML = `
      <h1>${D.esc(cx.name)}<span class="type-tag">${A.TYPE_NAME[cx.type] || cx.type}</span></h1>
      <div class="where">${D.esc([sggName, cx.umdNm, (cx.jibuns || [cx.jibun]).filter(Boolean).join(', ')].filter(Boolean).join(' '))}${others.length ? ` · 옛 이름 ${D.esc(others.join(', '))}` : ''}</div>
      <div class="facts">${facts.map(f => `<span>${D.esc(f)}</span>`).join('')}${links.join('')}</div>`;
  }

  // 원 → "1,201만" (만원 미만 반올림)
  const feeText = (obj, trade, p1, p2) => p1 == null ? '' : won(Math.round(Calc.brokerage.fee(obj, trade, p1, p2) / 10000));
  const n12 = b => (b.deal ? b.deal.n12 : 0) + (b.jeonse ? b.jeonse.n12 : 0) + (b.wolse ? b.wolse.n12 : 0);
  function prevYm(ym, k) {
    let y = +ym.slice(0, 4), m = +ym.slice(4, 6) - k;
    while (m < 1) { m += 12; y--; }
    return `${y}${String(m).padStart(2, '0')}`;
  }
  // 칩 한 줄 — 고른 값은 호출 쪽(st)이 들고 있는다(Dash.chips 는 첫 키를 기본으로 잡아 ?area= 첫 값을 못 심는다)
  function chipRow(id, facets, cur, onPick) {
    const box = document.getElementById(id);
    box.classList.add('chips');
    box.innerHTML = '';
    for (const [k, label] of Object.entries(facets)) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      b.classList.toggle('active', k === String(cur));
      b.onclick = () => onPick(k);
      box.appendChild(b);
    }
  }

  boot();
})();
</script>
</body>
</html>
