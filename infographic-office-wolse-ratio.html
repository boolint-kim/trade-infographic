<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오피스텔 월세 비중 추이 — 전국 17개 시도</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0} body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f0f2f5;color:#1a1a2e;padding:32px 20px}
  .container{max-width:1100px;margin:0 auto} .header{text-align:center;margin-bottom:28px} .header h1{font-size:26px;font-weight:800;margin-bottom:8px} .header p{font-size:13px;color:#6b7280;line-height:1.6}
  .selector{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:32px}
  .selector button{padding:8px 16px;border:2px solid #e5e7eb;border-radius:24px;background:#fff;font-size:13px;font-weight:600;color:#6b7280;cursor:pointer;transition:all .2s}
  .selector button:hover{border-color:#f97316;color:#f97316} .selector button.active{background:#f97316;border-color:#f97316;color:#fff}
  .summary-cards{display:flex;gap:16px;margin-bottom:28px;flex-wrap:wrap}
  .card{flex:1;min-width:200px;background:#fff;border-radius:16px;padding:20px 24px;box-shadow:0 2px 12px rgba(0,0,0,.07);border-top:4px solid}
  .card.a{border-color:#f97316} .card.b{border-color:#3b82f6} .card.c{border-color:#8b5cf6}
  .card .label{font-size:12px;font-weight:600;color:#6b7280;margin-bottom:4px} .card .value{font-size:32px;font-weight:900;line-height:1;margin-bottom:4px}
  .card.a .value{color:#f97316} .card.b .value{color:#3b82f6} .card.c .value{color:#8b5cf6}
  .card .sub{font-size:12px;color:#9ca3af} .card .unit{font-size:14px;font-weight:600;color:#9ca3af}
  .section{background:#fff;border-radius:16px;padding:28px 32px;box-shadow:0 2px 12px rgba(0,0,0,.07);margin-bottom:24px}
  .section-title{font-size:16px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .section-sub{font-size:12px;color:#9ca3af;margin-bottom:20px} .dot{width:12px;height:12px;border-radius:50%;display:inline-block}
  .chart-wrap{position:relative;width:100%}
  .footer{text-align:center;font-size:11px;color:#9ca3af;margin-top:12px;line-height:1.8}
  @media(max-width:700px){body{padding:12px 6px} .section{padding:14px;margin-bottom:14px;border-radius:10px} .header{margin-bottom:16px} .header h1{font-size:18px} .card{min-width:100%}
</style>
</head>
<body>
<div class="container">
  <div class="header"><h1>전월세 전환율 · 월세 비중 추이</h1><p>오피스텔 전세의 월세화 추세 | 전국 17개 시도 | 2016~2026</p></div>
  <div class="selector" id="sidoButtons"></div>
  <div class="summary-cards">
    <div class="card a"><div class="label" id="cL1"></div><div class="value" id="cV1"></div><div class="sub" id="cS1"></div></div>
    <div class="card b"><div class="label">평균 전세 보증금</div><div class="value" id="cV2"></div><div class="sub" id="cS2"></div></div>
    <div class="card c"><div class="label">평균 월세</div><div class="value" id="cV3"></div><div class="sub" id="cS3"></div></div>
  </div>
  <div class="section">
    <div class="section-title"><span class="dot" style="background:#f97316"></span><span id="t1">월세 비중 추이</span></div>
    <div class="section-sub" id="s1"></div>
    <div class="chart-wrap" style="height:300px"><canvas id="ratioChart"></canvas></div>
  </div>
  <div class="section">
    <div class="section-title"><span class="dot" style="background:#3b82f6"></span><span id="t2">전세 vs 월세 건수</span></div>
    <div class="section-sub" id="s2">연도별 전세·월세 거래 건수</div>
    <div class="chart-wrap" style="height:300px"><canvas id="countChart"></canvas></div>
  </div>
  <div class="section">
    <div class="section-title"><span class="dot" style="background:#8b5cf6"></span>시도별 월세 비중 비교</div>
    <div class="section-sub" id="sidoSub">최신 연도 기준</div>
    <div class="chart-wrap" style="height:380px"><canvas id="sidoChart"></canvas></div>
  </div>
  <div class="footer">데이터 출처: 국토교통부 실거래가 공개시스템 | 월세=월세>0, 전세=월세=0 | <span id="genDate"></span></div>
</div>
<script>
Chart.defaults.font.family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif";const _m=window.innerWidth<700;Chart.defaults.font.size=_m?11:13;
const fmt=n=>n.toLocaleString('ko-KR');
const SIDO_ORDER=['11','41','26','28','27','30','29','31','48','44','52','47','51','43','46','50','36'];
const C={'11':'#6366f1','41':'#3b82f6','26':'#f97316','28':'#f43f5e','27':'#10b981','30':'#8b5cf6','29':'#06b6d4','31':'#ec4899','48':'#14b8a6','44':'#a855f7','52':'#f59e0b','47':'#84cc16','51':'#0ea5e9','43':'#e11d48','46':'#7c3aed','50':'#059669','36':'#d946ef'};
let D,ch1,ch2,sidoChart;
async function load(){try{D=await(await fetch('data/office-wolse-ratio.json')).json();}catch{try{D=await(await fetch('office-wolse-ratio.json')).json();}catch{return;}} init();}
function init(){
  document.getElementById('genDate').textContent=`생성일: ${D.generated.slice(0,10)}`;
  const bc=document.getElementById('sidoButtons');
  SIDO_ORDER.forEach(c=>{if(!D.sido[c])return;const b=document.createElement('button');b.textContent=D.sido[c].name;b.dataset.code=c;b.onclick=()=>sel(c);bc.appendChild(b);});
  const codes=SIDO_ORDER.filter(c=>D.sido[c]);
  const latest=codes.map(c=>{const y=D.sido[c].yearly;return y[y.length-1].wolseRatio;});
  sidoChart=new Chart(document.getElementById('sidoChart'),{type:'bar',data:{labels:codes.map(c=>D.sido[c].name),datasets:[{data:latest,backgroundColor:'#fdba74cc',borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.raw}%`}}},scales:{x:{grid:{display:false}},y:{min:0,max:80,ticks:{callback:v=>v+'%'},grid:{color:'#f3f4f6'}}}}});
  sel('11');
}
function sel(code){
  document.querySelectorAll('.selector button').forEach(b=>b.classList.toggle('active',b.dataset.code===code));
  const s=D.sido[code];if(!s)return;const y=s.yearly;const last=y[y.length-1];const first=y[0];const col=C[code]||'#f97316';
  document.getElementById('cL1').textContent=`${s.name} 월세 비중 (${last.yr})`;
  document.getElementById('cV1').innerHTML=`${last.wolseRatio}<span class="unit">%</span>`;
  document.getElementById('cS1').textContent=`${first.yr}년 ${first.wolseRatio}% → ${last.yr}년 ${last.wolseRatio}%`;
  document.getElementById('cV2').innerHTML=`${(last.avgDeposit/10000).toFixed(1)}<span class="unit"> 억</span>`;
  document.getElementById('cS2').textContent=`${s.name} ${last.yr}년`;
  document.getElementById('cV3').innerHTML=`${last.avgMonthly||'-'}<span class="unit"> 만원</span>`;
  document.getElementById('cS3').textContent=`${s.name} ${last.yr}년 월세 평균`;
  document.getElementById('t1').textContent=`${s.name} 월세 비중 추이`;
  document.getElementById('s1').textContent=`${first.yr}~${last.yr}`;
  if(ch1)ch1.destroy();
  ch1=new Chart(document.getElementById('ratioChart'),{type:'line',data:{labels:y.map(r=>r.yr),datasets:[{label:'월세 비중(%)',data:y.map(r=>r.wolseRatio),borderColor:col,backgroundColor:col+'20',fill:true,tension:.3,pointRadius:5,pointBackgroundColor:col,pointBorderColor:'#fff',pointBorderWidth:2,borderWidth:2.5}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.raw}%`}}},scales:{x:{grid:{display:false}},y:{min:0,max:80,ticks:{callback:v=>v+'%'},grid:{color:'#f3f4f6'}}}}});
  document.getElementById('t2').textContent=`${s.name} 전세 vs 월세 건수`;
  if(ch2)ch2.destroy();
  ch2=new Chart(document.getElementById('countChart'),{type:'bar',data:{labels:y.map(r=>r.yr),datasets:[
    {label:'전세',data:y.map(r=>r.jeonse),backgroundColor:'#3b82f6aa',borderRadius:4},
    {label:'월세',data:y.map(r=>r.wolse),backgroundColor:'#f97316aa',borderRadius:4}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{usePointStyle:true,padding:16}},tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${fmt(ctx.raw)}건`}}},
    scales:{x:{grid:{display:false},stacked:true},y:{stacked:true,ticks:{callback:v=>fmt(v)},grid:{color:'#f3f4f6'}}}}});
  const codes=SIDO_ORDER.filter(c=>D.sido[c]);
  sidoChart.data.datasets[0].backgroundColor=codes.map(c=>c===code?(C[c]||'#f97316')+'cc':'#d1d5dbcc');
  sidoChart.update();
}
load();
</script>
</body>
</html>
