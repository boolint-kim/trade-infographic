<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 아파트 거래 현황 — 전국 17개 시도</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f0f2f5;color:#1a1a2e;padding:32px 20px}
  .container{max-width:1100px;margin:0 auto}
  .header{text-align:center;margin-bottom:28px} .header h1{font-size:26px;font-weight:800;margin-bottom:8px} .header p{font-size:13px;color:#6b7280;line-height:1.6}
  .selector{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:32px}
  .selector button{padding:8px 16px;border:2px solid #e5e7eb;border-radius:24px;background:#fff;font-size:13px;font-weight:600;color:#6b7280;cursor:pointer;transition:all .2s}
  .selector button:hover{border-color:#10b981;color:#10b981} .selector button.active{background:#10b981;border-color:#10b981;color:#fff}
  .summary-cards{display:flex;gap:16px;margin-bottom:28px;flex-wrap:wrap}
  .card{flex:1;min-width:200px;background:#fff;border-radius:16px;padding:20px 24px;box-shadow:0 2px 12px rgba(0,0,0,.07);border-top:4px solid}
  .card.a{border-color:#10b981} .card.b{border-color:#6366f1} .card.c{border-color:#ef4444}
  .card .label{font-size:12px;font-weight:600;color:#6b7280;margin-bottom:4px}
  .card .value{font-size:32px;font-weight:900;line-height:1;margin-bottom:4px}
  .card.a .value{color:#10b981} .card.b .value{color:#6366f1} .card.c .value{color:#ef4444}
  .card .sub{font-size:12px;color:#9ca3af} .card .unit{font-size:14px;font-weight:600;color:#9ca3af}
  .section{background:#fff;border-radius:16px;padding:28px 32px;box-shadow:0 2px 12px rgba(0,0,0,.07);margin-bottom:24px}
  .section-title{font-size:16px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .section-sub{font-size:12px;color:#9ca3af;margin-bottom:20px}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block}
  .trade-table{width:100%;border-collapse:collapse;font-size:13px}
  .trade-table th{background:#f8fafc;padding:10px 12px;text-align:left;font-weight:700;color:#6b7280;border-bottom:2px solid #e5e7eb;white-space:nowrap}
  .trade-table td{padding:10px 12px;border-bottom:1px solid #f3f4f6}
  .trade-table tr:hover{background:#fefce8}
  .price{font-weight:800;color:#ef4444} .rank-num{font-weight:900;color:#6366f1;font-size:16px} .area-info{font-size:11px;color:#9ca3af}
  .footer{text-align:center;font-size:11px;color:#9ca3af;margin-top:12px;line-height:1.8}
  @media(max-width:700px){.card{min-width:100%} .trade-table{font-size:12px} .trade-table th,.trade-table td{padding:8px 6px}}
</style>
</head>
<body>
<div class="container">
  <div class="header"><h1>오늘의 아파트 거래 현황</h1><p id="periodText">이번 달 일별 거래 신고 현황 | 신고일로부터 1~2일 지연 반영</p></div>
  <div class="selector" id="sidoButtons"></div>
  <div class="summary-cards">
    <div class="card a"><div class="label" id="cL1"></div><div class="value" id="cV1"></div><div class="sub" id="cS1"></div></div>
    <div class="card b"><div class="label">일 최다 신고</div><div class="value" id="cV2"></div><div class="sub" id="cS2"></div></div>
    <div class="card c"><div class="label">이달 최고가</div><div class="value" id="cV3"></div><div class="sub" id="cS3"></div></div>
  </div>
  <div class="section">
    <div class="section-title"><span class="dot" style="background:#10b981"></span><span id="chartTitle">일별 거래 신고</span></div>
    <div class="section-sub" id="chartSub">최근 3~5일은 신고 지연으로 건수 적음</div>
    <canvas id="dailyChart" height="280"></canvas>
  </div>
  <div class="section">
    <div class="section-title"><span class="dot" style="background:#6366f1"></span>시도별 이달 거래량</div>
    <div class="section-sub" id="sidoSub"></div>
    <canvas id="sidoChart" height="380"></canvas>
  </div>
  <div class="section">
    <div class="section-title"><span class="dot" style="background:#ef4444"></span><span id="tableTitle">이달 고가 거래 TOP 5</span></div>
    <div class="section-sub">거래금액 상위</div>
    <div style="overflow-x:auto">
      <table class="trade-table"><thead><tr><th>#</th><th>단지명</th><th>위치</th><th>거래가</th><th>면적</th><th>층</th><th>거래일</th></tr></thead>
      <tbody id="tableBody"></tbody></table>
    </div>
  </div>
  <div class="footer">데이터 출처: 국토교통부 실거래가 공개시스템 | 최근 3~5일은 신고 지연 | <span id="genDate"></span></div>
</div>
<script>
Chart.defaults.font.family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif";
const _m=window.innerWidth<700;Chart.defaults.font.size=_m?11:13;
const fmt=n=>n.toLocaleString('ko-KR');
const SIDO_ORDER=['11','41','26','28','27','30','29','31','48','44','52','47','51','43','46','50','36'];
const COLORS={'11':'#6366f1','41':'#3b82f6','26':'#f97316','28':'#f43f5e','27':'#10b981','30':'#8b5cf6','29':'#06b6d4','31':'#ec4899','48':'#14b8a6','44':'#a855f7','52':'#f59e0b','47':'#84cc16','51':'#0ea5e9','43':'#e11d48','46':'#7c3aed','50':'#059669','36':'#d946ef'};
let DATA,dailyChart,sidoChart,cur='ALL';

async function load(){
  try{DATA=await(await fetch('data/daily-trades.json')).json();}catch{try{DATA=await(await fetch('daily-trades.json')).json();}catch{return;}}
  init();
}
function init(){
  document.getElementById('genDate').textContent=`생성일: ${DATA.generated.slice(0,10)}`;
  const bc=document.getElementById('sidoButtons');
  const allBtn=document.createElement('button');allBtn.textContent='전국';allBtn.dataset.code='ALL';allBtn.onclick=()=>selectSido('ALL');bc.appendChild(allBtn);
  SIDO_ORDER.forEach(c=>{if(!DATA.sido[c])return;const b=document.createElement('button');b.textContent=DATA.sido[c].name;b.dataset.code=c;b.onclick=()=>selectSido(c);bc.appendChild(b);});
  initSidoChart();
  selectSido('ALL');
}
function initSidoChart(){
  const codes=SIDO_ORDER.filter(c=>DATA.sido[c]);
  sidoChart=new Chart(document.getElementById('sidoChart'),{
    type:'bar',data:{labels:codes.map(c=>DATA.sido[c].name),datasets:[{data:codes.map(c=>DATA.sido[c].total),backgroundColor:'#6ee7b7cc',borderRadius:4}]},
    options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${fmt(ctx.raw)}건`}}},
    scales:{x:{grid:{display:false}},y:{ticks:{callback:v=>fmt(v)},grid:{color:'#f3f4f6'}}}}
  });
}
function fmtDate(d){return d?d.slice(5).replace('-','/'):''}
function selectSido(code){
  cur=code;
  document.querySelectorAll('.selector button').forEach(b=>b.classList.toggle('active',b.dataset.code===code));
  let daily,total,avgPrice,topTrades,name;
  if(code==='ALL'){
    name='전국';daily=DATA.nationalDaily;total=daily.reduce((s,r)=>s+r.cnt,0);avgPrice=null;topTrades=[];
    // 전국 고가 = 서울 고가
    if(DATA.sido['11']&&DATA.sido['11'].topTrades) topTrades=DATA.sido['11'].topTrades;
  } else {
    const s=DATA.sido[code];name=s.name;daily=s.daily;total=s.total;avgPrice=s.avgPrice;topTrades=s.topTrades||[];
  }

  document.getElementById('cL1').textContent=`${name} 이달 누적`;
  document.getElementById('cV1').innerHTML=`${fmt(total)}<span class="unit"> 건</span>`;
  document.getElementById('cS1').textContent='신고 진행 중 (잠정치)';

  if(daily.length>0){
    const peak=daily.reduce((m,r)=>r.cnt>m.cnt?r:m,daily[0]);
    document.getElementById('cV2').innerHTML=`${fmt(peak.cnt)}<span class="unit"> 건</span>`;
    document.getElementById('cS2').textContent=fmtDate(peak.dealDate);
  }

  if(topTrades.length>0){
    const t=topTrades[0];
    document.getElementById('cV3').innerHTML=`${(t.price/10000).toFixed(1)}<span class="unit"> 억</span>`;
    document.getElementById('cS3').textContent=`${t.name} · ${t.umdNm}`;
  } else {
    document.getElementById('cV3').innerHTML='-';document.getElementById('cS3').textContent='';
  }

  // 일별 차트
  document.getElementById('chartTitle').textContent=`${name} 일별 거래 신고`;
  const color=COLORS[code]||'#10b981';
  if(dailyChart)dailyChart.destroy();
  dailyChart=new Chart(document.getElementById('dailyChart'),{
    type:'bar',data:{labels:daily.map(r=>fmtDate(r.dealDate)),datasets:[{data:daily.map(r=>r.cnt),
      backgroundColor:daily.map((r,i)=>i>=daily.length-3?'#d1d5dbcc':color+'aa'),borderRadius:3}]},
    options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${fmt(ctx.raw)}건`}}},
    scales:{x:{grid:{display:false},ticks:{font:{size:_m?10:12},maxRotation:45}},y:{min:0,ticks:{callback:v=>fmt(v)},grid:{color:'#f3f4f6'}}}}
  });

  // 시도 비교 강조
  const codes=SIDO_ORDER.filter(c=>DATA.sido[c]);
  sidoChart.data.datasets[0].backgroundColor=codes.map(c=>c===code?(COLORS[c]||'#10b981')+'cc':code==='ALL'?'#6ee7b7cc':'#d1d5dbcc');
  document.getElementById('sidoSub').textContent=`이달 기준 | 선택: ${name}`;
  sidoChart.update();

  // 고가 거래 테이블
  document.getElementById('tableTitle').textContent=`${name} 이달 고가 거래 TOP 5`;
  const tbody=document.getElementById('tableBody');
  tbody.innerHTML='';
  topTrades.forEach((t,i)=>{
    const pyeong=(parseFloat(t.area)*0.3025).toFixed(1);
    const tr=document.createElement('tr');
    tr.innerHTML=`<td class="rank-num">${i+1}</td><td><strong>${t.name}</strong></td><td>${t.umdNm}</td>
      <td class="price">${(t.price/10000).toFixed(1)}억</td>
      <td class="area-info">${parseFloat(t.area).toFixed(1)}m² (${pyeong}평)</td><td>${t.floor}층</td><td>${fmtDate(t.dealDate)}</td>`;
    tbody.appendChild(tr);
  });
}
load();
</script>
</body>
</html>
