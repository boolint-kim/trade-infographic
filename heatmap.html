<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부동산 평당가 히트맵</title>
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=zzpp6ehncu"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#1a1a2e}
#map{width:100%;height:100vh}

/* 컨트롤 패널 */
.ctrl{position:absolute;top:8px;left:8px;z-index:1;display:flex;flex-direction:column;gap:0;max-width:calc(100% - 120px)}
.ctrl-toggle{min-height:36px;padding:0 14px;border:none;border-radius:10px;background:rgba(255,255,255,.95);font-size:13px;font-weight:700;color:#333;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);display:flex;align-items:center;gap:6px;white-space:nowrap;align-self:flex-start}
.ctrl-toggle:active{background:#f0f0f0}
.ctrl-panel{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.ctrl-panel.hidden{display:none}
.ctrl-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ctrl-box{background:rgba(255,255,255,.95);border-radius:10px;padding:8px 12px;box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:13px;font-weight:600;color:#333}
.ctrl-box select{border:1px solid #ddd;border-radius:6px;padding:4px 8px;font-size:12px;font-weight:600;background:#fff;color:#333;min-height:36px}

/* 면적 필터 버튼 */
.btn{min-height:44px;padding:0 16px;border:2px solid #e5e7eb;border-radius:22px;background:#fff;font-size:12px;font-weight:700;color:#6b7280;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;justify-content:center}
.btn:hover{border-color:#3b82f6;color:#3b82f6}
.btn.active{background:#3b82f6;border-color:#3b82f6;color:#fff}

/* 레이어 토글 칩 */
.layer-chip{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:0 12px;border:2px solid #e5e7eb;border-radius:18px;background:#fff;font-size:12px;font-weight:700;color:#6b7280;cursor:pointer;transition:all .15s;user-select:none}
.layer-chip input{display:none}
.layer-chip:hover{border-color:#6b7280;color:#333}
.layer-chip.active{background:#1a1a2e;border-color:#1a1a2e;color:#fff}
.layer-chip.loading{opacity:.5;pointer-events:none}

/* 도형 아이콘 */
.icon-circle{display:inline-block;width:10px;height:10px;border-radius:50%;background:currentColor;vertical-align:middle}
.icon-square{display:inline-block;width:10px;height:10px;background:currentColor;vertical-align:middle}
.icon-triangle{display:inline-block;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid currentColor;vertical-align:middle}

/* 현재 위치 버튼 */
.loc-btn{position:absolute;right:8px;bottom:110px;z-index:1;width:44px;height:44px;border-radius:50%;background:#fff;border:none;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px}
.loc-btn:active{background:#f0f0f0}

/* 범례 */
.legend{position:absolute;bottom:16px;left:8px;z-index:1;background:rgba(255,255,255,.95);border-radius:10px;padding:12px 16px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.legend-title{font-size:11px;font-weight:700;color:#333;margin-bottom:6px}
.legend-bar{width:200px;height:14px;border-radius:7px;background:linear-gradient(to right,#3b82f6,#10b981,#f59e0b,#ef4444,#7c3aed)}
.legend-labels{display:flex;justify-content:space-between;font-size:10px;color:#6b7280;margin-top:2px}
.legend-shapes{display:flex;gap:10px;margin-top:6px;font-size:10px;color:#6b7280;align-items:center}
.legend-shape-item{display:inline-flex;align-items:center;gap:4px}
.legend-period{font-size:10px;color:#9ca3af;margin-top:4px}

/* 팝업 */
.info-wrap{font-size:13px;line-height:1.6;min-width:180px;padding:14px 16px}
.info-wrap .name{font-size:15px;font-weight:800;margin-bottom:4px;color:#1a1a2e}
.info-wrap .loc{font-size:11px;color:#6b7280;margin-bottom:8px}
.info-wrap .type-badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:700;background:#1a1a2e;color:#fff;margin-bottom:6px}
.info-wrap .row{display:flex;justify-content:space-between;gap:16px;padding:2px 0;border-radius:6px}
.info-wrap .label{color:#6b7280;font-size:12px}
.info-wrap .val{font-weight:800;color:#1a1a2e}
.info-wrap .val.high{color:#ef4444}
.info-wrap .row.active-filter{background:#eff6ff;margin:0 -4px;padding:2px 4px}
.info-wrap .row.active-filter .label{color:#3b82f6;font-weight:700}
.info-wrap .row.active-filter .val{color:#3b82f6}
.info-wrap .hint{font-size:10px;color:#9ca3af;margin-top:6px;text-align:center}

/* 로딩 */
.loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;background:rgba(255,255,255,.95);border-radius:16px;padding:24px 40px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.loading h3{font-size:16px;color:#333;margin-bottom:8px}
.loading p{font-size:13px;color:#6b7280;margin-bottom:12px}
.retry-btn{min-height:44px;padding:0 24px;border:none;border-radius:22px;background:#3b82f6;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.retry-btn:active{background:#2563eb}

/* 통계 — 모바일 퍼스트 */
.stats{position:absolute;top:8px;right:8px;z-index:1;background:rgba(255,255,255,.95);border-radius:10px;padding:6px 10px;box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:12px;color:#333;text-align:right}
.stats .big{font-size:16px;font-weight:900;color:#3b82f6}
.stats .sub{font-size:10px;color:#6b7280}

/* 토스트 */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:400;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}

/* 힌트 — legend 위로 띄움 (겹침 방지) */
#hint{position:absolute;bottom:140px;left:50%;transform:translateX(-50%);z-index:1;background:rgba(0,0,0,.65);color:#fff;padding:8px 18px;border-radius:20px;font-size:12px;pointer-events:none;transition:opacity .4s;white-space:nowrap}
#hint.hidden{opacity:0}

/* 인포윈도우 열린 동안 UI 카드/컨트롤 흐리게 — naver #map의 stacking context를 깰 수 없어 시각적으로만 양보 */
body.popup-open .ctrl,
body.popup-open .stats,
body.popup-open .legend,
body.popup-open .loc-btn,
body.popup-open #hint{opacity:.15;pointer-events:none;transition:opacity .2s}

/* 반응형 — 태블릿/PC (모바일이 기본) */
@media (min-width: 481px) {
  .ctrl{top:12px;left:12px;max-width:calc(100% - 130px)}
  .ctrl-toggle{min-height:36px;font-size:13px;padding:0 14px}
  .btn{padding:0 16px;font-size:12px}
  .layer-chip{min-height:36px;padding:0 12px;font-size:12px}
  /* PC/태블릿: mapTypeControl(우상단) + ⓘ 정보보기 툴팁 영역까지 비우고 stats를 아래로 */
  .stats{top:96px;right:12px;padding:10px 16px}
  .stats .big{font-size:20px}
  .stats .sub{font-size:11px}
  .legend{bottom:32px;left:12px;padding:12px 16px}
  .legend-bar{width:200px}
  .loc-btn{right:12px;bottom:130px}
  #hint{bottom:170px}
}
@media (max-width: 360px) {
  .ctrl-row{gap:4px}
  .btn{padding:0 7px;font-size:10px}
  .layer-chip{padding:0 7px;font-size:10px}
}
</style>
</head>
<body>
<div id="map"></div>
<div class="loading" id="loading"><h3>데이터 로딩 중...</h3><p>아파트 단지별 평당가</p></div>

<div id="toast"></div>
<div id="hint">확대하면 단지별 평당가를 확인할 수 있어요</div>

<div class="ctrl">
  <!-- 패널 토글 버튼 (항상 표시) -->
  <button class="ctrl-toggle" id="ctrlToggle" onclick="togglePanel()">필터 ▾</button>

  <!-- 접힘/펼침 패널 -->
  <div class="ctrl-panel" id="ctrlPanel">
    <!-- 레이어 토글 -->
    <div class="ctrl-row">
      <label class="layer-chip active" id="chipApt" title="아파트 레이어">
        <input type="checkbox" checked onchange="toggleLayer('apt', this.checked)">
        <span class="icon-circle"></span> 아파트
      </label>
      <label class="layer-chip" id="chipOffice" title="오피스텔 레이어">
        <input type="checkbox" onchange="toggleLayer('office', this.checked)">
        <span class="icon-square"></span> 오피스텔
      </label>
      <label class="layer-chip" id="chipMulti" title="연립다세대 레이어">
        <input type="checkbox" onchange="toggleLayer('multi', this.checked)">
        <span class="icon-triangle"></span> 다세대
      </label>
    </div>
    <!-- 면적 필터 -->
    <div class="ctrl-row" id="filterRow">
      <button class="btn active" id="btnAll"   onclick="setFilter('all')">전체</button>
      <button class="btn" id="btnSmall" onclick="setFilter('small')">소형(&lt;60)</button>
      <button class="btn" id="btnMid"   onclick="setFilter('mid')">중형(60~85)</button>
      <button class="btn" id="btnLarge" onclick="setFilter('large')">대형(85+)</button>
    </div>
    <!-- 기간 선택 -->
    <div class="ctrl-row">
      <div class="ctrl-box">
        기간: <select id="selPeriod" onchange="setPeriod(this.value)"></select>
      </div>
    </div>
  </div>
</div>

<div class="stats" id="stats"></div>

<button class="loc-btn" onclick="goToMyLocation()" title="현재 위치">📍</button>

<div class="legend">
  <div class="legend-title">평당가 (만원)</div>
  <div class="legend-bar"></div>
  <div class="legend-labels"><span>~1,000</span><span>2,000</span><span>3,000</span><span>4,000</span><span>5,000+</span></div>
  <div class="legend-shapes">
    <span class="legend-shape-item"><span class="icon-circle" style="color:#6b7280"></span> 아파트</span>
    <span class="legend-shape-item"><span class="icon-square" style="color:#6b7280"></span> 오피스텔</span>
    <span class="legend-shape-item"><span class="icon-triangle" style="color:#6b7280"></span> 다세대</span>
  </div>
  <div class="legend-period" id="legendPeriod"></div>
</div>

<script>
// --- 레이어 설정 ---
var LAYER_CFG = {
  apt:    { shape: 'circle',   label: '아파트',  url: 'data/heatmap.json',        enabled: true,  loading: false },
  office: { shape: 'square',   label: '오피스텔', url: 'data/heatmap-office.json', enabled: false, loading: false },
  multi:  { shape: 'triangle', label: '다세대',  url: 'data/heatmap-multi.json',  enabled: false, loading: false },
};
var layerData  = { apt: [], office: [], multi: [] };
var layerGrids = { apt: new Map(), office: new Map(), multi: new Map() };
var layerReady = { apt: false, office: false, multi: false };
var LAYER_KEYS = ['apt', 'office', 'multi'];

var map, canvasLayer, infoWindow, myLocationMarker;
var allMonths = [];
var currentFilter = 'all';
var currentPeriod = 6;
var ZOOM_LABEL = 14;
var GRID_SIZE = 0.01;
var panelOpen = true;  // 패널 상태

// --- 공간 인덱스 ---
function buildLayerGrid(key, data) {
  var g = layerGrids[key];
  g.clear();
  for (var i = 0; i < data.length; i++) {
    var d = data[i];
    var k = Math.floor(d.y / GRID_SIZE) + '|' + Math.floor(d.x / GRID_SIZE);
    if (!g.has(k)) g.set(k, []);
    g.get(k).push(i);
  }
}

function getVisibleLayerIndices(bounds, key) {
  var g = layerGrids[key];
  var minR = Math.floor(bounds.south() / GRID_SIZE);
  var maxR = Math.floor(bounds.north() / GRID_SIZE);
  var minC = Math.floor(bounds.west() / GRID_SIZE);
  var maxC = Math.floor(bounds.east() / GRID_SIZE);
  var indices = [];
  for (var r = minR; r <= maxR; r++) {
    for (var c = minC; c <= maxC; c++) {
      var arr = g.get(r + '|' + c);
      if (arr) for (var i = 0; i < arr.length; i++) indices.push(arr[i]);
    }
  }
  return indices;
}

// --- 가격 유틸 ---
function priceRGBA(p, a) {
  if (p >= 5000) return [124,58,237,a];
  if (p >= 4000) return [239,68,68,a];
  if (p >= 3000) return [245,158,11,a];
  if (p >= 2000) return [16,185,129,a];
  return [59,130,246,a];
}

function priceHex(p) {
  if (p >= 5000) return '#7c3aed';
  if (p >= 4000) return '#ef4444';
  if (p >= 3000) return '#f59e0b';
  if (p >= 2000) return '#10b981';
  return '#3b82f6';
}

function fmt(n) { return n == null ? '-' : n.toLocaleString(); }
function esc(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }

function getSelectedMonths() {
  return allMonths.slice(-currentPeriod);
}

function filterKey() {
  if (currentFilter === 'large') return 'l';
  if (currentFilter === 'mid') return 'm';
  if (currentFilter === 'small') return 's';
  return 'a';
}

function getPriceByKey(d, fk) {
  var months = getSelectedMonths();
  var sum = 0, cnt = 0;
  for (var i = 0; i < months.length; i++) {
    var mo = d.mo[months[i]];
    if (!mo) continue;
    if (fk === 'a') {
      sum += mo.a * mo.c;
      cnt += mo.c;
    } else {
      if (mo[fk] != null) { sum += mo[fk]; cnt += 1; }
    }
  }
  return cnt > 0 ? Math.round(sum / cnt) : null;
}

function getPrice(d) {
  return getPriceByKey(d, filterKey());
}

function getCount(d) {
  var months = getSelectedMonths();
  var total = 0;
  for (var i = 0; i < months.length; i++) {
    var mo = d.mo[months[i]];
    if (mo) total += mo.c;
  }
  return total;
}

// --- 도형 그리기 ---
function drawShape(ctx, shape, px, py, size, fillStyle) {
  ctx.fillStyle = fillStyle;
  if (shape === 'circle') {
    ctx.beginPath();
    ctx.arc(px, py, size, 0, Math.PI * 2);
    ctx.fill();
  } else if (shape === 'square') {
    // 원에 내접하는 정사각형: 한 변 = r*√2, 반변 = r/√2
    var half = size / Math.SQRT2;
    ctx.fillRect(px - half, py - half, half * 2, half * 2);
  } else if (shape === 'triangle') {
    // 원에 내접하는 정삼각형: 외접원 반지름 = size
    var sin60 = Math.sqrt(3) / 2; // ≈ 0.866
    ctx.beginPath();
    ctx.moveTo(px,              py - size);           // 상단 꼭짓점
    ctx.lineTo(px + size * sin60, py + size * 0.5);  // 우하단 꼭짓점
    ctx.lineTo(px - size * sin60, py + size * 0.5);  // 좌하단 꼭짓점
    ctx.closePath();
    ctx.fill();
  }
}

// --- 통계 (화면 내 단지 기준) ---
function computeViewportStats(bounds) {
  var withPrice = 0, total = 0;
  for (var ki = 0; ki < LAYER_KEYS.length; ki++) {
    var key = LAYER_KEYS[ki];
    if (!LAYER_CFG[key].enabled || !layerReady[key]) continue;
    var data = layerData[key];
    var visibleIdx = getVisibleLayerIndices(bounds, key);
    for (var i = 0; i < visibleIdx.length; i++) {
      var price = getPrice(data[visibleIdx[i]]);
      if (price != null) { withPrice++; total += getCount(data[visibleIdx[i]]); }
    }
  }
  return { withPrice: withPrice, count: total };
}

// --- 토스트 ---
var toastTimer = null;
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2200);
}

// --- 힌트 ---
function updateHint(zoom) {
  var hint = document.getElementById('hint');
  if (zoom >= 12) {
    hint.classList.add('hidden');
  } else if (zoom >= 10) {
    hint.textContent = '조금 더 확대하면 단지를 탭해 상세 정보를 볼 수 있어요';
    hint.classList.remove('hidden');
  } else {
    hint.textContent = '확대하면 단지별 평당가를 확인할 수 있어요';
    hint.classList.remove('hidden');
  }
}

// --- Canvas 오버레이 ---
function CanvasHeatLayer(map) {
  this._map = map;
  this._canvas = document.createElement('canvas');
  this._canvas.style.position = 'absolute';
  this._canvas.style.top = '0';
  this._canvas.style.left = '0';
  this._canvas.style.pointerEvents = 'none';
  this._ctx = this._canvas.getContext('2d');
  this.setMap(map);
}

CanvasHeatLayer.prototype = new naver.maps.OverlayView();

CanvasHeatLayer.prototype.onAdd = function() {
  this.getPanes().overlayLayer.appendChild(this._canvas);
};

CanvasHeatLayer.prototype.onRemove = function() {
  this._canvas.parentNode.removeChild(this._canvas);
};

CanvasHeatLayer.prototype.draw = function() {
  if (!layerReady.apt) return;

  var proj = this.getProjection();
  var mapSize = this._map.getSize();
  var dpr = window.devicePixelRatio || 1;

  this._canvas.width = mapSize.width * dpr;
  this._canvas.height = mapSize.height * dpr;
  this._canvas.style.width = mapSize.width + 'px';
  this._canvas.style.height = mapSize.height + 'px';

  var mapBounds = this._map.getBounds();
  var topLeft = proj.fromCoordToOffset(new naver.maps.LatLng(mapBounds.north(), mapBounds.west()));
  this._canvas.style.left = topLeft.x + 'px';
  this._canvas.style.top = topLeft.y + 'px';

  var ctx = this._ctx;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, mapSize.width, mapSize.height);

  var zoom = this._map.getZoom();
  var showLabel = zoom >= ZOOM_LABEL;

  var dotSize;
  if (zoom >= 17) dotSize = 10;
  else if (zoom >= 16) dotSize = 8;
  else if (zoom >= 15) dotSize = 7;
  else if (zoom >= 14) dotSize = 6;
  else if (zoom >= 13) dotSize = 5;
  else if (zoom >= 12) dotSize = 4;
  else if (zoom >= 11) dotSize = 3;
  else if (zoom >= 10) dotSize = 3;
  else if (zoom >= 9)  dotSize = 2;
  else dotSize = 2;

  var originCoord = new naver.maps.LatLng(mapBounds.north(), mapBounds.west());
  var originPx = proj.fromCoordToOffset(originCoord);

  // 레이어별 그리기 (apt → office → multi 순서)
  for (var li = 0; li < LAYER_KEYS.length; li++) {
    var key = LAYER_KEYS[li];
    var cfg = LAYER_CFG[key];
    if (!cfg.enabled || !layerReady[key]) continue;

    var data = layerData[key];
    var visibleIdx = getVisibleLayerIndices(mapBounds, key);

    for (var vi = 0; vi < visibleIdx.length; vi++) {
      var d = data[visibleIdx[vi]];
      var price = getPrice(d);
      if (price == null) continue;

      var pt = proj.fromCoordToOffset(new naver.maps.LatLng(d.y, d.x));
      var px = pt.x - originPx.x;
      var py = pt.y - originPx.y;

      var rgba = priceRGBA(price, 0.55);
      drawShape(ctx, cfg.shape, px, py, dotSize, 'rgba(' + rgba[0] + ',' + rgba[1] + ',' + rgba[2] + ',' + rgba[3] + ')');

      if (showLabel) {
        var label = price >= 10000 ? (price / 10000).toFixed(1) + '억' : fmt(price);
        ctx.font = '700 10px Apple SD Gothic Neo, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        var tw = ctx.measureText(label).width + 8;
        var th = 16;
        var bx = px - tw / 2;
        var by = py - dotSize - 4 - th;
        ctx.fillStyle = priceHex(price);
        ctx.beginPath();
        ctx.roundRect(bx, by, tw, th, 8);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillText(label, px, py - dotSize - 6);
      }
    }
  }

  // 통계 업데이트 (화면 내 단지 기준)
  var vpStats = computeViewportStats(mapBounds);
  var filterLabel = {all:'전체 면적', small:'소형 <60㎡', mid:'중형 60~85㎡', large:'대형 85㎡+'}[currentFilter];
  var activeLabels = LAYER_KEYS.filter(function(k) { return LAYER_CFG[k].enabled && layerReady[k]; })
    .map(function(k) { return LAYER_CFG[k].label; }).join('+');
  document.getElementById('stats').innerHTML =
    '<div class="big">' + vpStats.withPrice.toLocaleString() + ' 단지</div>' +
    '<div class="sub">' + vpStats.count.toLocaleString() + ' 건</div>' +
    '<div class="sub">' + filterLabel + ' | 최근 ' + currentPeriod + '개월</div>' +
    (activeLabels ? '<div class="sub" style="color:#3b82f6">' + activeLabels + '</div>' : '');

  updateHint(zoom);
};

// --- 인포윈도우 open/close 래퍼 (body.popup-open 토글) ---
function openInfo(content, latlng) {
  infoWindow.setContent(content);
  infoWindow.open(map, latlng);
  document.body.classList.add('popup-open');
}
function closeInfo() {
  infoWindow.close();
  document.body.classList.remove('popup-open');
}

// --- 클릭 처리 ---
function onMapClick(e) {
  if (!layerReady.apt) return;
  var zoom = map.getZoom();

  if (zoom < 12) {
    closeInfo();
    showToast('단지 정보를 보려면 더 확대해 주세요');
    return;
  }

  var proj = canvasLayer.getProjection();
  var clickPx = proj.fromCoordToOffset(e.coord);
  var bestDist = 900; // 30px^2
  var bestD = null;
  var bestKey = null;

  var bounds = map.getBounds();

  for (var li = 0; li < LAYER_KEYS.length; li++) {
    var key = LAYER_KEYS[li];
    if (!LAYER_CFG[key].enabled || !layerReady[key]) continue;

    var data = layerData[key];
    var visibleIdx = getVisibleLayerIndices(bounds, key);

    for (var i = 0; i < visibleIdx.length; i++) {
      var d = data[visibleIdx[i]];
      var price = getPrice(d);
      if (price == null) continue;

      var pt = proj.fromCoordToOffset(new naver.maps.LatLng(d.y, d.x));
      var dx = pt.x - clickPx.x;
      var dy = pt.y - clickPx.y;
      var dist = dx * dx + dy * dy;
      if (dist < bestDist) {
        bestDist = dist;
        bestD = d;
        bestKey = key;
      }
    }
  }

  if (bestD) {
    var fk = filterKey();
    var pAll   = getPriceByKey(bestD, 'a');
    var pLarge = getPriceByKey(bestD, 'l');
    var pMid   = getPriceByKey(bestD, 'm');
    var pSmall = getPriceByKey(bestD, 's');
    var cnt    = getCount(bestD);
    var typeLabel = LAYER_CFG[bestKey].label;

    function rowCls(k) {
      return fk === k ? 'row active-filter' : 'row';
    }

    openInfo(
      '<div class="info-wrap" onclick="closeInfo()" style="cursor:pointer">' +
        '<div class="type-badge">' + typeLabel + '</div>' +
        '<div class="name">' + esc(bestD.n) + '</div>' +
        '<div class="loc">' + esc(bestD.u) + ' | ' + esc(bestD.r) + '</div>' +
        '<div class="' + rowCls('a') + '"><span class="label">전체 평당가</span><span class="val high">' + (pAll   ? fmt(pAll)   + '만' : '-') + '</span></div>' +
        '<div class="' + rowCls('l') + '"><span class="label">대형(85㎡+)</span><span class="val">'    + (pLarge ? fmt(pLarge) + '만' : '-') + '</span></div>' +
        '<div class="' + rowCls('m') + '"><span class="label">중형(60~85㎡)</span><span class="val">'  + (pMid   ? fmt(pMid)   + '만' : '-') + '</span></div>' +
        '<div class="' + rowCls('s') + '"><span class="label">소형(&lt;60㎡)</span><span class="val">' + (pSmall ? fmt(pSmall) + '만' : '-') + '</span></div>' +
        '<div class="row"><span class="label">거래건수</span><span class="val">' + cnt + '건</span></div>' +
        '<div class="hint">탭하여 닫기</div>' +
      '</div>',
      new naver.maps.LatLng(bestD.y, bestD.x)
    );
  } else {
    closeInfo();
  }
}

// --- 패널 토글 ---
function togglePanel() {
  var panel = document.getElementById('ctrlPanel');
  var btn = document.getElementById('ctrlToggle');
  panelOpen = !panelOpen;
  if (panelOpen) {
    panel.classList.remove('hidden');
    btn.textContent = '필터 ▴';
  } else {
    panel.classList.add('hidden');
    btn.textContent = '필터 ▾';
  }
}

// --- 레이어 토글 ---
function toggleLayer(key, enabled) {
  LAYER_CFG[key].enabled = enabled;
  var chip = document.getElementById('chip' + key.charAt(0).toUpperCase() + key.slice(1));
  if (chip) {
    if (enabled) chip.classList.add('active');
    else chip.classList.remove('active');
  }

  // 처음 활성화 시 레이지 로딩
  if (enabled && !layerReady[key]) {
    loadLayerData(key);
    return;
  }

  canvasLayer.draw();
}

// --- 면적 필터 ---
function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('#filterRow .btn').forEach(function(b) { b.classList.remove('active'); });
  var btnId = {all:'btnAll', small:'btnSmall', mid:'btnMid', large:'btnLarge'}[f];
  document.getElementById(btnId).classList.add('active');
  canvasLayer.draw();
}

// --- 기간 ---
function setPeriod(v) {
  currentPeriod = parseInt(v);
  // 범례 기간 텍스트 업데이트
  var months = getSelectedMonths();
  if (months.length > 0) {
    var from = months[0], to = months[months.length - 1];
    document.getElementById('legendPeriod').textContent =
      '기준: ' + from.slice(0,4) + '.' + from.slice(4) + ' ~ ' + to.slice(0,4) + '.' + to.slice(4);
  }
  canvasLayer.draw();
}

// --- 현재 위치 ---
function showMyLocation(lat, lng) {
  var latlng = new naver.maps.LatLng(lat, lng);
  if (myLocationMarker) {
    myLocationMarker.setPosition(latlng);
  } else {
    myLocationMarker = new naver.maps.Marker({
      position: latlng,
      map: map,
      icon: {
        content: '<div style="width:16px;height:16px;background:#3b82f6;border:3px solid #fff;border-radius:50%;box-shadow:0 0 6px rgba(59,130,246,.6)"></div>',
        anchor: new naver.maps.Point(8, 8)
      },
      zIndex: 300
    });
  }
  map.setCenter(latlng);
  map.setZoom(14);
}

function goToMyLocation() {
  if (!navigator.geolocation) {
    showToast('이 브라우저는 위치 서비스를 지원하지 않습니다');
    return;
  }
  showToast('위치 확인 중...');
  // 캐시된 위치로 빠르게 이동 후, 정밀 위치로 보정
  navigator.geolocation.getCurrentPosition(
    function(pos) { showMyLocation(pos.coords.latitude, pos.coords.longitude); },
    function() {},
    { maximumAge: 60000, timeout: 3000, enableHighAccuracy: false }
  );
  navigator.geolocation.getCurrentPosition(
    function(pos) { showMyLocation(pos.coords.latitude, pos.coords.longitude); },
    function() { showToast('위치 정보를 가져올 수 없습니다'); },
    { maximumAge: 0, timeout: 10000, enableHighAccuracy: true }
  );
}

// --- 데이터 로딩 ---
function loadAptData() {
  var loading = document.getElementById('loading');
  loading.innerHTML = '<h3>데이터 로딩 중...</h3><p>아파트 단지별 평당가</p>';
  loading.style.display = '';

  fetch('data/heatmap.json')
    .then(function(r) { return r.json(); })
    .then(function(json) {
      layerData.apt = json.data;
      allMonths = json.months;
      layerReady.apt = true;
      buildLayerGrid('apt', layerData.apt);

      var sel = document.getElementById('selPeriod');
      sel.innerHTML = '';
      for (var i = 1; i <= allMonths.length; i++) {
        var selected = (i === allMonths.length) ? ' selected' : '';
        sel.innerHTML += '<option value="' + i + '"' + selected + '>최근 ' + i + '개월</option>';
      }
      currentPeriod = allMonths.length;

      if (json.period) {
        document.getElementById('legendPeriod').textContent = '기준: ' + json.period.replace('~', ' ~ ');
      }

      loading.style.display = 'none';
      canvasLayer.draw();
    })
    .catch(function(err) {
      loading.innerHTML =
        '<h3>데이터 로딩 실패</h3><p>' + err.message + '</p>' +
        '<button class="retry-btn" onclick="loadAptData()">다시 시도</button>';
    });
}

function loadLayerData(key) {
  if (layerReady[key] || LAYER_CFG[key].loading) return;
  LAYER_CFG[key].loading = true;

  var chipId = 'chip' + key.charAt(0).toUpperCase() + key.slice(1);
  var chip = document.getElementById(chipId);
  if (chip) chip.classList.add('loading');

  showToast(LAYER_CFG[key].label + ' 데이터 로딩 중...');

  fetch(LAYER_CFG[key].url)
    .then(function(r) { return r.json(); })
    .then(function(json) {
      layerData[key] = json.data;
      layerReady[key] = true;
      LAYER_CFG[key].loading = false;
      buildLayerGrid(key, layerData[key]);
      if (chip) chip.classList.remove('loading');
      canvasLayer.draw();
      showToast(LAYER_CFG[key].label + ' ' + json.total.toLocaleString() + '개 단지 로드 완료');
    })
    .catch(function(err) {
      LAYER_CFG[key].loading = false;
      LAYER_CFG[key].enabled = false;
      if (chip) {
        chip.classList.remove('loading');
        chip.classList.remove('active');
        chip.querySelector('input').checked = false;
      }
      showToast(LAYER_CFG[key].label + ' 로딩 실패');
    });
}

// --- 초기화 ---
function initMap() {
  // 모바일에서 패널 기본 접힘
  if (window.innerWidth <= 480) {
    panelOpen = false;
    document.getElementById('ctrlPanel').classList.add('hidden');
    document.getElementById('ctrlToggle').textContent = '필터 ▾';
  } else {
    document.getElementById('ctrlToggle').textContent = '필터 ▴';
  }

  var isMobile = window.innerWidth <= 480;
  map = new naver.maps.Map('map', {
    center: new naver.maps.LatLng(36.5, 127.5),
    zoom: 7,
    mapTypeControl: !isMobile,
    zoomControl: true,
    zoomControlOptions: { position: naver.maps.Position.RIGHT_CENTER }
  });

  infoWindow = new naver.maps.InfoWindow({
    borderWidth: 0,
    borderColor: 'transparent',
    backgroundColor: '#fff',
    anchorSize: new naver.maps.Size(10, 10),
    pixelOffset: new naver.maps.Point(0, -4),
    zIndex: 1000  // .ctrl/.stats/.legend/.loc-btn(z-index:100) 위에 표시
  });

  canvasLayer = new CanvasHeatLayer(map);

  naver.maps.Event.addListener(map, 'click', onMapClick);
  naver.maps.Event.addListener(map, 'idle', function() { canvasLayer.draw(); });

  loadAptData();
}

if (document.readyState === 'complete') {
  initMap();
} else {
  window.addEventListener('load', initMap);
}
</script>

</html>
