<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아파트 평당가 히트맵</title>
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=zzpp6ehncu"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#1a1a2e}
#map{width:100%;height:100vh}
.ctrl{position:absolute;top:12px;left:12px;z-index:100;display:flex;flex-direction:column;gap:8px}
.ctrl-row{display:flex;gap:6px;align-items:center}
.ctrl-box{background:rgba(255,255,255,.95);border-radius:10px;padding:8px 12px;box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:13px;font-weight:600;color:#333}
.ctrl-box select{border:1px solid #ddd;border-radius:6px;padding:4px 8px;font-size:12px;font-weight:600;background:#fff;color:#333}
.btn{padding:6px 14px;border:2px solid #e5e7eb;border-radius:20px;background:#fff;font-size:12px;font-weight:700;color:#6b7280;cursor:pointer;transition:all .15s}
.btn:hover{border-color:#3b82f6;color:#3b82f6}
.btn.active{background:#3b82f6;border-color:#3b82f6;color:#fff}
.legend{position:absolute;bottom:32px;left:12px;z-index:100;background:rgba(255,255,255,.95);border-radius:10px;padding:12px 16px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.legend-title{font-size:11px;font-weight:700;color:#333;margin-bottom:6px}
.legend-bar{width:200px;height:14px;border-radius:7px;background:linear-gradient(to right,#3b82f6,#10b981,#f59e0b,#ef4444,#7c3aed)}
.legend-labels{display:flex;justify-content:space-between;font-size:10px;color:#6b7280;margin-top:2px}
.info-wrap{font-size:13px;line-height:1.6;min-width:180px}
.info-wrap .name{font-size:15px;font-weight:800;margin-bottom:4px;color:#1a1a2e}
.info-wrap .loc{font-size:11px;color:#6b7280;margin-bottom:8px}
.info-wrap .row{display:flex;justify-content:space-between;gap:16px}
.info-wrap .label{color:#6b7280;font-size:12px}
.info-wrap .val{font-weight:800;color:#1a1a2e}
.info-wrap .val.high{color:#ef4444}
.loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;background:rgba(255,255,255,.95);border-radius:16px;padding:24px 40px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.loading h3{font-size:16px;color:#333;margin-bottom:8px}
.loading p{font-size:13px;color:#6b7280}
.stats{position:absolute;top:12px;right:12px;z-index:100;background:rgba(255,255,255,.95);border-radius:10px;padding:10px 16px;box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:12px;color:#333;text-align:right}
.stats .big{font-size:20px;font-weight:900;color:#3b82f6}
.stats .sub{font-size:11px;color:#6b7280}
</style>
</head>
<body>
<div id="map"></div>
<div class="loading" id="loading"><h3>데이터 로딩 중...</h3><p>아파트 단지별 평당가</p></div>

<div class="ctrl">
  <div class="ctrl-row">
    <button class="btn active" id="btnAll" onclick="setFilter('all')">전체</button>
    <button class="btn" id="btnSmall" onclick="setFilter('small')">소형(&lt;60)</button>
    <button class="btn" id="btnMid" onclick="setFilter('mid')">중형(60~85)</button>
    <button class="btn" id="btnLarge" onclick="setFilter('large')">대형(85+)</button>
  </div>
  <div class="ctrl-row">
    <div class="ctrl-box">
      기간: <select id="selPeriod" onchange="setPeriod(this.value)"></select>
    </div>
  </div>
</div>

<div class="stats" id="stats"></div>

<div class="legend">
  <div class="legend-title">평당가 (만원)</div>
  <div class="legend-bar"></div>
  <div class="legend-labels"><span>~1,000</span><span>2,000</span><span>3,000</span><span>4,000</span><span>5,000+</span></div>
</div>

<script>
let map, canvasLayer, infoWindow, allData = [], allMonths = [];
let currentFilter = 'all';  // all, small, mid, large
let currentPeriod = 6;       // 최근 N개월 (1~6)
let dataReady = false;
const ZOOM_LABEL = 14;

// --- 공간 인덱스 (0.01도 그리드 ≈ 1km) ---
const grid = new Map();
const GRID_SIZE = 0.01;

function buildGrid(data) {
  grid.clear();
  for (let i = 0; i < data.length; i++) {
    const d = data[i];
    const key = Math.floor(d.y / GRID_SIZE) + '|' + Math.floor(d.x / GRID_SIZE);
    if (!grid.has(key)) grid.set(key, []);
    grid.get(key).push(i);
  }
}

function getVisibleIndices(bounds) {
  const minR = Math.floor(bounds.south() / GRID_SIZE);
  const maxR = Math.floor(bounds.north() / GRID_SIZE);
  const minC = Math.floor(bounds.west() / GRID_SIZE);
  const maxC = Math.floor(bounds.east() / GRID_SIZE);
  const indices = [];
  for (let r = minR; r <= maxR; r++) {
    for (let c = minC; c <= maxC; c++) {
      const arr = grid.get(r + '|' + c);
      if (arr) {
        for (const idx of arr) indices.push(idx);
      }
    }
  }
  return indices;
}

// --- 가격 유틸 ---
function priceRGBA(p, a) {
  if (p >= 5000) return [124,58,237,a];
  if (p >= 4000) return [239,68,68,a];
  if (p >= 3000) return [245,158,11,a];
  if (p >= 2000) return [16,185,129,a];
  return [59,130,246,a];
}

function priceHex(p) {
  if (p >= 5000) return '#7c3aed';
  if (p >= 4000) return '#ef4444';
  if (p >= 3000) return '#f59e0b';
  if (p >= 2000) return '#10b981';
  return '#3b82f6';
}

function fmt(n) { return n == null ? '-' : n.toLocaleString(); }

// 선택된 기간의 월 목록 (최근 N개월)
function getSelectedMonths() {
  return allMonths.slice(-currentPeriod);
}

// 면적 필터 키
function filterKey() {
  if (currentFilter === 'large') return 'l';
  if (currentFilter === 'mid') return 'm';
  if (currentFilter === 'small') return 's';
  return 'a';
}

function getPrice(d) {
  var months = getSelectedMonths();
  var fk = filterKey();
  var sum = 0, cnt = 0;

  // 기간 내 월별 데이터를 합산하여 가중 평균 계산
  for (var i = 0; i < months.length; i++) {
    var mo = d.mo[months[i]];
    if (!mo) continue;
    if (fk === 'a') {
      sum += mo.a * mo.c;
      cnt += mo.c;
    } else {
      // 면적대별: 해당 면적대 값이 있는 월만
      if (mo[fk] != null) {
        // 면적대별 건수는 없으므로 1건으로 가중
        sum += mo[fk];
        cnt += 1;
      }
    }
  }
  return cnt > 0 ? Math.round(sum / cnt) : null;
}

function getCount(d) {
  var months = getSelectedMonths();
  var total = 0;
  for (var i = 0; i < months.length; i++) {
    var mo = d.mo[months[i]];
    if (mo) total += mo.c;
  }
  return total;
}

// --- Canvas 오버레이 ---
function CanvasHeatLayer(map) {
  this._map = map;
  this._canvas = document.createElement('canvas');
  this._canvas.style.position = 'absolute';
  this._canvas.style.top = '0';
  this._canvas.style.left = '0';
  this._canvas.style.pointerEvents = 'none';
  this._ctx = this._canvas.getContext('2d');
  this.setMap(map);
}

CanvasHeatLayer.prototype = new naver.maps.OverlayView();

CanvasHeatLayer.prototype.onAdd = function() {
  var panes = this.getPanes();
  panes.overlayLayer.appendChild(this._canvas);
};

CanvasHeatLayer.prototype.onRemove = function() {
  this._canvas.parentNode.removeChild(this._canvas);
};

CanvasHeatLayer.prototype.draw = function() {
  if (!dataReady) return;

  var proj = this.getProjection();
  var mapSize = this._map.getSize();
  var dpr = window.devicePixelRatio || 1;

  // Canvas 크기 맞추기
  this._canvas.width = mapSize.width * dpr;
  this._canvas.height = mapSize.height * dpr;
  this._canvas.style.width = mapSize.width + 'px';
  this._canvas.style.height = mapSize.height + 'px';

  // Canvas 위치: 지도 뷰포트 좌상단에 맞추기
  var mapBounds = this._map.getBounds();
  var topLeft = proj.fromCoordToOffset(new naver.maps.LatLng(mapBounds.north(), mapBounds.west()));
  this._canvas.style.left = topLeft.x + 'px';
  this._canvas.style.top = topLeft.y + 'px';

  var ctx = this._ctx;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, mapSize.width, mapSize.height);

  var zoom = this._map.getZoom();
  var bounds = mapBounds;
  var showLabel = zoom >= ZOOM_LABEL;

  // 줌 레벨별 원형 크기 (px)
  var dotSize;
  if (zoom >= 16) dotSize = 18;
  else if (zoom >= 15) dotSize = 14;
  else if (zoom >= 14) dotSize = 11;
  else if (zoom >= 13) dotSize = 8;
  else if (zoom >= 12) dotSize = 6;
  else if (zoom >= 11) dotSize = 5;
  else if (zoom >= 10) dotSize = 4;
  else if (zoom >= 9) dotSize = 3;
  else dotSize = 2;

  // 공간 인덱스로 뷰포트 내 데이터 추출
  var visibleIdx = getVisibleIndices(bounds);
  var totalCount = 0, totalWithPrice = 0;

  // 통계는 전체 데이터 기준
  for (var i = 0; i < allData.length; i++) {
    var price = getPrice(allData[i]);
    if (price != null) {
      totalWithPrice++;
      totalCount += getCount(allData[i]);
    }
  }

  // 원형 그리기
  var originCoord = new naver.maps.LatLng(mapBounds.north(), mapBounds.west());
  var originPx = proj.fromCoordToOffset(originCoord);

  for (var vi = 0; vi < visibleIdx.length; vi++) {
    var d = allData[visibleIdx[vi]];
    var price = getPrice(d);
    if (price == null) continue;

    var pt = proj.fromCoordToOffset(new naver.maps.LatLng(d.y, d.x));
    var px = pt.x - originPx.x;
    var py = pt.y - originPx.y;

    var rgba = priceRGBA(price, 0.5);
    ctx.beginPath();
    ctx.arc(px, py, dotSize, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(' + rgba[0] + ',' + rgba[1] + ',' + rgba[2] + ',' + rgba[3] + ')';
    ctx.fill();

    // 줌인 시 가격 라벨
    if (showLabel) {
      var label = price >= 10000 ? (price / 10000).toFixed(1) + '억' : fmt(price);
      ctx.font = '700 10px Apple SD Gothic Neo, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';

      // 배경
      var tw = ctx.measureText(label).width + 8;
      var th = 16;
      var bx = px - tw / 2;
      var by = py - dotSize - 4 - th;

      ctx.fillStyle = priceHex(price);
      ctx.beginPath();
      ctx.roundRect(bx, by, tw, th, 8);
      ctx.fill();

      // 텍스트
      ctx.fillStyle = '#fff';
      ctx.fillText(label, px, py - dotSize - 6);
    }
  }

  // 통계 업데이트
  var filterLabel = {all:'전체 면적', small:'소형 <60㎡', mid:'중형 60~85㎡', large:'대형 85㎡+'}[currentFilter];
  document.getElementById('stats').innerHTML =
    '<div class="big">' + totalWithPrice.toLocaleString() + '</div>' +
    '<div class="sub">단지 (' + totalCount.toLocaleString() + '건)</div>' +
    '<div class="sub">' + filterLabel + ' | 최근 ' + currentPeriod + '개월</div>';
};

// --- 클릭 처리: Canvas는 pointerEvents:none이므로 지도 클릭으로 처리 ---
function onMapClick(e) {
  if (!dataReady) return;
  var zoom = map.getZoom();
  if (zoom < 12) return; // 너무 줌아웃이면 클릭 무시

  var clickLat = e.coord.lat();
  var clickLng = e.coord.lng();

  // 클릭 지점에서 가장 가까운 단지 찾기 (화면 기준 30px 이내)
  var proj = canvasLayer.getProjection();
  var clickPx = proj.fromCoordToOffset(e.coord);
  var bestDist = 900; // 30px^2
  var bestD = null;

  var bounds = map.getBounds();
  var visibleIdx = getVisibleIndices(bounds);

  for (var i = 0; i < visibleIdx.length; i++) {
    var d = allData[visibleIdx[i]];
    var price = getPrice(d);
    if (price == null) continue;

    var pt = proj.fromCoordToOffset(new naver.maps.LatLng(d.y, d.x));
    var dx = pt.x - clickPx.x;
    var dy = pt.y - clickPx.y;
    var dist = dx * dx + dy * dy;
    if (dist < bestDist) {
      bestDist = dist;
      bestD = d;
    }
  }

  if (bestD) {
    infoWindow.setContent('<div class="info-wrap">' +
      '<div class="name">' + bestD.n + '</div>' +
      '<div class="loc">' + bestD.u + ' | ' + bestD.r + '</div>' +
      '<div class="row"><span class="label">전체 평당가</span><span class="val high">' + (bestD.a ? fmt(bestD.a) + '만' : '-') + '</span></div>' +
      '<div class="row"><span class="label">대형(85㎡+)</span><span class="val">' + (bestD.l ? fmt(bestD.l) + '만' : '-') + '</span></div>' +
      '<div class="row"><span class="label">중형(60~85㎡)</span><span class="val">' + (bestD.m ? fmt(bestD.m) + '만' : '-') + '</span></div>' +
      '<div class="row"><span class="label">소형(&lt;60㎡)</span><span class="val">' + (bestD.s ? fmt(bestD.s) + '만' : '-') + '</span></div>' +
      '<div class="row"><span class="label">거래건수</span><span class="val">' + bestD.c + '건</span></div>' +
      '</div>');
    infoWindow.open(map, new naver.maps.LatLng(bestD.y, bestD.x));
  }
}

// --- 필터/기간 ---
function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.ctrl-row:first-child .btn').forEach(function(b) { b.classList.remove('active'); });
  var btnId = {all:'btnAll', small:'btnSmall', mid:'btnMid', large:'btnLarge'}[f];
  document.getElementById(btnId).classList.add('active');
  canvasLayer.draw();
}

function setPeriod(v) {
  currentPeriod = parseInt(v);
  canvasLayer.draw();
}

// --- 초기화 ---
function initMap() {
  map = new naver.maps.Map('map', {
    center: new naver.maps.LatLng(36.5, 127.5),
    zoom: 7,
    mapTypeControl: true,
    zoomControl: true,
    zoomControlOptions: { position: naver.maps.Position.RIGHT_CENTER }
  });

  infoWindow = new naver.maps.InfoWindow({
    borderWidth: 0,
    borderColor: 'transparent',
    backgroundColor: '#fff',
    anchorSize: new naver.maps.Size(10, 10),
    pixelOffset: new naver.maps.Point(0, -4)
  });

  canvasLayer = new CanvasHeatLayer(map);

  naver.maps.Event.addListener(map, 'click', onMapClick);

  // 줌 변경 및 패닝 완료 후 캔버스 갱신
  naver.maps.Event.addListener(map, 'idle', function() {
    canvasLayer.draw();
  });

  loadData();
}

function loadData() {
  fetch('data/heatmap.json')
    .then(function(r) { return r.json(); })
    .then(function(json) {
      allData = json.data;
      allMonths = json.months;
      dataReady = true;
      buildGrid(allData);

      var sel = document.getElementById('selPeriod');
      sel.innerHTML = '';
      for (var i = 1; i <= allMonths.length; i++) {
        var selected = (i === allMonths.length) ? ' selected' : '';
        sel.innerHTML += '<option value="' + i + '"' + selected + '>최근 ' + i + '개월</option>';
      }
      currentPeriod = allMonths.length;

      document.getElementById('loading').style.display = 'none';
      canvasLayer.draw();
    })
    .catch(function(err) {
      document.getElementById('loading').innerHTML = '<h3>데이터 로딩 실패</h3><p>' + err.message + '</p>';
    });
}

// 시작
if (document.readyState === 'complete') {
  initMap();
} else {
  window.addEventListener('load', initMap);
}
</script>
</body>
</html>
